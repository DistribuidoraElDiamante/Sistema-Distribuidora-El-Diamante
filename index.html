<style>
:root{--bg:#f2f3f6;--sf:#fff;--sf2:#f6f6f3;--tx:#181c27;--mu:#5f6779;--bd:#e1e4ea;--ac:#8a6a16;--ac2:#d4a93c;--acT:#fbf4e2;--tn:#faf0d4;--ng:#c0312a;--ps:#13774a;--shadow:0 1px 2px rgba(16,20,30,.05),0 10px 24px -14px rgba(16,20,30,.18);--shadowLg:0 24px 60px -20px rgba(16,20,30,.4);--radius:14px;--fHead:'Sora',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fBody:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fMono:'IBM Plex Mono','Courier New',Courier,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.brand{display:flex;align-items:center;gap:16px}

.gemWrap.lg::after{content:'';position:absolute;inset:-30% -60%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.65) 50%,transparent 58%);transform:translateX(-140%);animation:shine 1.1s .4s ease-out 1}

nav{display:flex;gap:2px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--radius);margin:16px 0 18px;padding:5px;overflow-x:auto;box-shadow:var(--shadow)}

.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}

.kp div::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--ac2),var(--ac))}

.nt{background:var(--tn);border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);border-radius:9px;padding:12px 14px;margin-bottom:14px}.nt ul{margin:8px 0 0;padding-left:18px}.nt li{margin-bottom:3px}
.bd{background:var(--ng);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;margin-left:4px;font-weight:600}
#ask,#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(92vw,460px);width:max-content;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:11px;padding:14px 16px;z-index:9;box-shadow:var(--shadowLg);animation:pop .16s ease-out}
#ask{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
#ask p{margin:0 0 10px}[hidden]{display:none!important}
#mdBg{position:fixed;inset:0;background:rgba(10,12,16,.55);backdrop-filter:blur(2px);z-index:15;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease-out}
#mdBox{background:var(--sf);color:var(--tx);border-radius:14px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadowLg);animation:pop .18s ease-out}
#mdBox h2{font-family:var(--fHead)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(140%)}}
.auth{max-width:400px;margin:40px auto;text-align:center}
.auth .gemWrap{margin-bottom:12px}
.auth label,.auth .g{text-align:left}
.pos-receipt{font-family:var(--fMono);font-size:13px;max-width:320px;margin:0 auto;color:var(--tx)}
.pos-c{text-align:center}
.pos-mu{color:var(--mu);font-size:12px}
.pos-hr{border-top:1px dashed var(--bd);margin:8px 0}
.pl-row{display:flex;justify-content:space-between;gap:10px;margin:4px 0}
.pl-row+.pl-row{margin-top:2px}
@media print{
 @page{size:80mm auto;margin:2mm}
 body *{visibility:hidden}
 #mdBox,#mdBox *{visibility:visible}
 #mdBg{position:static;background:none;padding:0;backdrop-filter:none;animation:none}
 #mdBox{position:absolute;left:0;top:0;width:76mm;max-width:76mm;box-shadow:none;border:0;padding:0;background:#fff;animation:none}
 .pos-receipt{max-width:100%;font-size:11px;color:#000}
 .pos-mu{color:#000}
 .pos-hr{border-top:1px dashed #000}
 #posActions{display:none!important}
}
</style>

<body>
<main>
<div class="top"><div class="brand"><div class="gemWrap"><svg class="gem" width="46" height="46" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="gemGradHeader" x1="4" y1="8" x2="44" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs><path d="M12 8H36L44 18L24 42L4 18Z" fill="url(#gemGradHeader)"/><path class="facet-hi" d="M12 8L17 18L4 18Z"/><path class="facet-lo" d="M36 8L44 18L31 18Z"/><path class="facet-mid" d="M17 18L31 18L24 42Z"/><path class="facet-line" d="M4 18H44M12 8L17 18M36 8L31 18M17 18L24 42M31 18L24 42" fill="none"/></svg></div><div><h1>Sistema de Distribuidora el Diamante</h1><p class="m">Los datos se guardan en la nube (Firebase) y se sincronizan automáticamente en todos los computadores conectados a internet.</p></div></div><div class="utility"><span id="sess" class="m"></span><div id="adminTools" hidden><button class="l" onclick="backup()">Guardar copia de seguridad</button><label class="l" style="cursor:pointer;flex-direction:row;color:var(--mu)">Importar copia<input type="file" accept=".json,application/json" hidden onchange="restore(this.files[0]);this.value=''"></label><button class="ld" id="wipeBtn" hidden onclick="wipeAll()">Eliminar todos los datos</button></div></div></div>
<nav>
<button data-t="inv">Inventario</button>
<button data-t="fc">Ventas</button>
<button data-t="fac">Facturas</button>
<button data-t="in">Registrar entrada</button>
<button data-t="out">Salidas</button>
<button data-t="c">Conteo físico</button>
<button data-t="f">Flujo de dinero</button>
<button data-t="n">Nómina</button>
<button data-t="d">Deudas</button>
<button data-t="k">Movimientos</button>

</nav>

</main>

<div id="mdBg" hidden><div id="mdBox"></div></div>
<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc, getDocs, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";

// ====================================================================
// PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE (Firebase Console > Configuración
// del proyecto > tus apps > el ícono "</>" de la app web > "Config").
// Reemplaza TODO el objeto de abajo por el que copiaste de tu proyecto.
// ====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyD04s1YKLuRIEghKJBcZvzpE6Mqnbp2Xuk",
  authDomain: "distribuidora-el-diamante.firebaseapp.com",
  projectId: "distribuidora-el-diamante",
  storageBucket: "distribuidora-el-diamante.firebasestorage.app",
  messagingSenderId: "348671232695",
  appId: "1:348671232695:web:a9cb2e5ad866f4d71e1b32"
};
// ====================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const functions = getFunctions(app);

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GEM=size=>`<svg class="gem" width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="gemGrad${size}" x1="4" y1="8" x2="44" y2="42" gradientUnits="userSpaceOnUse"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></linearGradient></defs><path d="M12 8H36L44 18L24 42L4 18Z" fill="url(#gemGrad${size})"/><path class="facet-hi" d="M12 8L17 18L4 18Z"/><path class="facet-lo" d="M36 8L44 18L31 18Z"/><path class="facet-mid" d="M17 18L31 18L24 42Z"/><path class="facet-line" d="M4 18H44M12 8L17 18M36 8L31 18M17 18L24 42M31 18L24 42" fill="none"/></svg>`;
const money=n=>n==null?'sin precio':'$'+Math.round(n).toLocaleString('es-CO');
const DOCT={CC:'Cédula de ciudadanía',CE:'Cédula de extranjería',TI:'Tarjeta de identidad',PA:'Pasaporte',PPT:'Permiso de Protección Temporal'};
const docOpts=sel=>Object.keys(DOCT).map(k=>`<option value="${k}" ${sel==k?'selected':''}>${k} · ${DOCT[k]}</option>`).join('');
function msg(t){const e=$('#msg');e.textContent=t;e.hidden=false;clearTimeout(msg.h);msg.h=setTimeout(()=>{e.hidden=true},4500)}
function ask(t,fn){const e=$('#ask');e.innerHTML=`<p>${esc(t)}</p><button class="b" id="ay">Sí, continuar</button> <button class="l" id="an">Cancelar</button>`;e.hidden=false;$('#ay').onclick=()=>{e.hidden=true;fn()};$('#an').onclick=()=>{e.hidden=true}}
function showErr(e){console.error(e);msg('Ocurrió un error'+(e&&e.code?(' ('+e.code+')'):'')+'. '+(e&&e.message?e.message:''))}
function toAuthEmail(u){return (u||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@eldiamante.local'}

let S={products:[],mov:[],cash:[],counts:[],inv:[],workers:[],payroll:[],debts:[],loans:[],users:[],cfg:{transportAux:0,invoiceSeq:0}};
let tab='inv';
let session=null;
let justSignedIn=false;
let authReady=false;
let cfgHasAdmin=null;
let unsubs=[];

function isAdmin(){return !!session&&session.role=='admin'}
function isSuperAdmin(){return isAdmin()&&(session.username||'').toLowerCase()=='daniel'}
function allowedTabs(role){return role=='admin'?['inv','fc','fac','in','out','c','f','n','d','k','bg','u']:['inv','fc','fac','in','out','d']}

function detachListeners(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function attachListeners(){
 const mk=(name,setter)=>onSnapshot(collection(db,name),snap=>{setter(snap.docs.map(d=>({id:d.id,...d.data()})));render()},e=>showErr(e));
 unsubs.push(mk('products',arr=>S.products=arr.map(normProduct)));
 unsubs.push(mk('movements',arr=>S.mov=arr));
 unsubs.push(mk('cash',arr=>S.cash=arr));
 unsubs.push(mk('counts',arr=>S.counts=arr));
 unsubs.push(mk('invoices',arr=>S.inv=arr));
 unsubs.push(mk('workers',arr=>S.workers=arr));
 unsubs.push(mk('payroll',arr=>S.payroll=arr));
 unsubs.push(mk('debts',arr=>S.debts=arr));
 unsubs.push(mk('loans',arr=>S.loans=arr));
 if(isAdmin())unsubs.push(mk('users',arr=>S.users=arr));
 unsubs.push(onSnapshot(doc(db,'config','main'),snap=>{S.cfg=snap.exists()?snap.data():{transportAux:0,invoiceSeq:0};render()},e=>showErr(e)));
}
function attachOwnProfileListener(uid){
 unsubs.push(onSnapshot(doc(db,'users',uid),snap=>{
  if(!snap.exists()||snap.data().active===false){msg('Tu acceso fue desactivado.');signOut(auth);return}
  session={id:uid,email:auth.currentUser.email,...snap.data()};render()
 },e=>{}))
}
let bootstrapping=false;
onAuthStateChanged(auth,async user=>{
 if(bootstrapping)return; // doSetupAdmin maneja su propia sesión una vez termina de escribir el perfil
 detachListeners();
 if(!user){session=null;authReady=true;render();return}
 try{
  const snap=await getDoc(doc(db,'users',user.uid));
  if(!snap.exists()||snap.data().active===false){await signOut(auth);msg('Tu cuenta no tiene acceso o fue desactivada.');return}
  session={id:user.uid,email:user.email,...snap.data()};
  authReady=true;cfgHasAdmin=true;
  attachListeners();attachOwnProfileListener(user.uid);
  if(justSignedIn){msg(`Bienvenido, ${session.name}.`);justSignedIn=false}
  render()
 }catch(e){showErr(e)}
});
async function checkHasAdmin(){
 try{const snap=await getDoc(doc(db,'config','main'));cfgHasAdmin=snap.exists()&&snap.data().hasAdmin===true}
 catch(e){cfgHasAdmin=false;showErr(e)}
 render()
}

function setupView(){
 return `<section class="auth"><div class="gemWrap lg">${GEM(52)}</div><h2>Configuración inicial</h2><p class="m" style="margin-bottom:12px">Crea la cuenta del administrador principal. Desde esa cuenta podrás crear los perfiles de los vendedores.</p><div class="g" style="grid-template-columns:1fr"><label>Tu nombre<input id="suN" placeholder="Ej. Daniel Usuga"></label><label>Usuario<input id="suU" autocomplete="username"></label><label>Contraseña<input id="suP" type="password" autocomplete="new-password"></label><label>Confirmar contraseña<input id="suP2" type="password" autocomplete="new-password"></label></div><button class="b" id="suGo" style="width:100%">Crear administrador</button></section>`}
function wireSetup(){
 $('#suGo').onclick=doSetupAdmin;
 ['#suN','#suU','#suP','#suP2'].forEach(s=>{$(s).onkeydown=e=>{if(e.key=='Enter')doSetupAdmin()}});
 setTimeout(()=>{const e=$('#suN');if(e)e.focus()},0)}
async function doSetupAdmin(){
 const name=$('#suN').value.trim(),username=$('#suU').value.trim(),p=$('#suP').value,p2=$('#suP2').value;
 if(!name||!username)return msg('Escribe tu nombre y un nombre de usuario.');
 if(!p||p.length<4)return msg('Escribe una contraseña de al menos 4 caracteres.');
 if(p!=p2)return msg('Las contraseñas no coinciden.');
 const email=toAuthEmail(username);
 if(email=='@eldiamante.local')return msg('Escribe un usuario válido (letras y números).');
 bootstrapping=true;
 try{
  const cred=await createUserWithEmailAndPassword(auth,email,p);
  await runTransaction(db,async tx=>{
   const cfgRef=doc(db,'config','main');
   const cfgSnap=await tx.get(cfgRef);
   if(cfgSnap.exists()&&cfgSnap.data().hasAdmin===true)throw new Error('Ya existe un administrador.');
   tx.set(doc(db,'users',cred.user.uid),{name,username,role:'admin',active:true});
   tx.set(cfgRef,{hasAdmin:true,transportAux:(cfgSnap.exists()?cfgSnap.data().transportAux||0:0),invoiceSeq:(cfgSnap.exists()?cfgSnap.data().invoiceSeq||0:0)});
  });
  session={id:cred.user.uid,email,name,username,role:'admin',active:true};
  authReady=true;cfgHasAdmin=true;
  attachListeners();attachOwnProfileListener(cred.user.uid);
  msg(`Cuenta de administrador creada. Bienvenido, ${name}.`);
  render()
 }catch(e){
  if(e.code=='auth/email-already-in-use')msg('Ya existe un usuario con ese nombre de usuario.');
  else{try{await signOut(auth)}catch(e2){}showErr(e)}
 }finally{bootstrapping=false}}
function loginView(){
 return `<section class="auth"><div class="gemWrap lg">${GEM(52)}</div><h2>Iniciar sesión</h2><p class="m" style="margin-bottom:12px">Ingresa tu usuario y contraseña para entrar al sistema.</p><div class="g" style="grid-template-columns:1fr"><label>Usuario<input id="luU" autocomplete="username"></label><label>Contraseña<input id="luP" type="password" autocomplete="current-password"></label></div><button class="b" id="luGo" style="width:100%">Entrar</button></section>`}
function wireLogin(){
 $('#luGo').onclick=doLogin;
 ['#luU','#luP'].forEach(s=>{$(s).onkeydown=e=>{if(e.key=='Enter')doLogin()}});
 setTimeout(()=>{const e=$('#luU');if(e)e.focus()},0)}
async function doLogin(){
 const u=$('#luU').value.trim(),p=$('#luP').value;
 if(!u||!p)return msg('Escribe tu usuario y contraseña.');
 const email=toAuthEmail(u);
 justSignedIn=true;
 try{await signInWithEmailAndPassword(auth,email,p)}
 catch(e){
  justSignedIn=false;
  if(['auth/invalid-credential','auth/user-not-found','auth/wrong-password'].includes(e.code))msg('Usuario o contraseña incorrectos.');
  else showErr(e)
 }}
function logout(){signOut(auth)}
function changeMyPw(){
 openModal(`<h2 style="margin-top:0">Cambiar mi contraseña</h2><div class="g" style="grid-template-columns:1fr"><label>Contraseña actual<input id="cpOld" type="password"></label><label>Nueva contraseña<input id="cpNew" type="password"></label><label>Confirmar nueva contraseña<input id="cpNew2" type="password"></label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="doChangeMyPw()">Guardar</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);

async function doChangeMyPw(){
 const old=$('#cpOld').value,nw=$('#cpNew').value,nw2=$('#cpNew2').value;
 if(!old||!nw)return msg('Completa los dos campos.');
 if(nw.length<4)return msg('La nueva contraseña debe tener al menos 4 caracteres.');
 if(nw!=nw2)return msg('Las contraseñas no coinciden.');
 try{
  const cred=EmailAuthProvider.credential(auth.currentUser.email,old);
  await reauthenticateWithCredential(auth.currentUser,cred);
  await updatePassword(auth.currentUser,nw);
  closeModal();msg('Contraseña actualizada.')
 }catch(e){
  if(['auth/invalid-credential','auth/wrong-password'].includes(e.code))msg('La contraseña actual no es correcta.');

 }}

function resetVendorPw(id){
 if(!isAdmin())return;
 const u=S.users.find(x=>x.id==id);if(!u)return;
 if(u.role!='vendedor')return msg('Solo puedes restablecer la contraseña de cuentas de vendedor.');
 openModal(`<h2 style="margin-top:0">Restablecer contraseña: ${esc(u.name)}</h2><p class="m" style="margin-bottom:10px">Escribe la nueva contraseña para esta cuenta de vendedor. La contraseña actual quedará reemplazada de inmediato.</p><div class="g" style="grid-template-columns:1fr"><label>Nueva contraseña<input id="rvP" type="password" autocomplete="new-password"></label><label>Confirmar nueva contraseña<input id="rvP2" type="password" autocomplete="new-password"></label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="doResetVendorPw('${id}')">Guardar</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#rvP');if(e)e.focus()},0)}
async function doResetVendorPw(id){
 if(!isAdmin())return;
 const nw=$('#rvP').value,nw2=$('#rvP2').value;
 if(!nw)return msg('Escribe la nueva contraseña.');
 if(nw.length<4)return msg('La nueva contraseña debe tener al menos 4 caracteres.');
 if(nw!=nw2)return msg('Las contraseñas no coinciden.');
 try{
  const call=httpsCallable(functions,'resetVendorPassword');
  await call({targetUid:id,newPassword:nw});
  closeModal();msg('Contraseña actualizada.')
 }catch(e){
  const code=e&&e.code?String(e.code).replace('functions/',''):'';
  if(code=='permission-denied')msg('Solo puedes restablecer la contraseña de cuentas de vendedor, no de otros administradores.');
  else if(code=='unauthenticated')msg('Tu sesión expiró. Vuelve a iniciar sesión e intenta de nuevo.');
  else if(code=='not-found')msg('No encuentro esa cuenta de usuario.');
  else if(code=='invalid-argument')msg('Revisa la contraseña escrita.');
  else showErr(e)
 }}

async function addUser(){
 if(!isAdmin())return;
 const name=$('#unN').value.trim(),username=$('#unU').value.trim(),p=$('#unP').value,role=$('#unR').value;
 if(!name||!username)return msg('Escribe el nombre y el usuario.');
 if(!p||p.length<4)return msg('Escribe una contraseña de al menos 4 caracteres.');
 const email=toAuthEmail(username);
 if(email=='@eldiamante.local')return msg('Escribe un usuario válido (letras y números).');
 const secApp=initializeApp(firebaseConfig,'Secondary-'+Date.now());
 const secAuth=getAuth(secApp);
 try{
  const cred=await createUserWithEmailAndPassword(secAuth,email,p);
  const uid=cred.user.uid;
  try{await signOut(secAuth)}catch(e){}

  msg('Usuario creado.');render()
 }catch(e){
  if(e.code=='auth/email-already-in-use')msg('Ya existe un usuario con ese nombre de usuario.');

 }finally{try{await deleteApp(secApp)}catch(e){}}}
function editUser(id){

 const u=S.users.find(x=>x.id==id);if(!u)return;
 openModal(`<h2 style="margin-top:0">Editar usuario</h2><div class="g" style="grid-template-columns:1fr"><label>Nombre<input id="euN" value="${esc(u.name)}"></label><label>Usuario (no se puede cambiar)<input value="${esc(u.username)}" disabled></label><label>Rol<select id="euR"><option value="vendedor" ${u.role=='vendedor'?'selected':''}>Vendedor</option><option value="admin" ${u.role=='admin'?'selected':''}>Administrador</option></select></label><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="euA" style="width:auto" ${u.active!==false?'checked':''}> Cuenta activa</label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="saveUser('${id}')">Guardar cambios</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#euN');if(e)e.focus()},0)}
async function saveUser(id){
 if(!isAdmin())return;
 const u=S.users.find(x=>x.id==id);if(!u)return;
 const name=$('#euN').value.trim(),role=$('#euR').value,active=$('#euA').checked;
 if(!name)return msg('Escribe el nombre.');
 const willStayAdmin=role=='admin'&&active,wasAdmin=u.role=='admin'&&u.active!==false;
 if(wasAdmin&&!willStayAdmin&&!S.users.some(x=>x.id!=id&&x.role=='admin'&&x.active!==false))return msg('Debe quedar al menos un administrador activo.');
 try{await updateDoc(doc(db,'users',id),{name,role,active});closeModal();msg('Usuario actualizado.');render()}
 catch(e){showErr(e)}}
function delUser(id){
 if(!isAdmin())return;
 const u=S.users.find(x=>x.id==id);if(!u)return;
 if(session&&session.id==id)return msg('No puedes eliminar tu propia cuenta mientras estás conectado con ella.');
 if(u.role=='admin'&&u.active!==false&&!S.users.some(x=>x.id!=id&&x.role=='admin'&&x.active!==false))return msg('Debe quedar al menos un administrador activo: no puedes eliminar el último.');
 ask(`¿Eliminar el acceso del usuario "${u.name}"? Ya no podrá entrar al sistema.`,async()=>{
  try{await deleteDoc(doc(db,'users',id));render()}catch(e){showErr(e)}})}

function normPres(x){return {n:x.n,q:x.q,p1:x.p1!=null?x.p1:(x.p!=null?x.p:null),p2:x.p2!=null?x.p2:null,p3:x.p3!=null?x.p3:null}}
function normProduct(p){return {...p,pres:(p.pres||[]).map(normPres)}}
const stock=id=>S.mov.filter(m=>m.pid==id).reduce((a,m)=>a+m.u,0);
function fmt(p,u){const neg=u<0;let r=Math.abs(u),o=[];[...p.pres].sort((a,b)=>b.q-a.q).forEach(x=>{const n=Math.floor(r/x.q);if(n>0){o.push(n+' × '+esc(x.n));r-=n*x.q}});const s=o.join(' + ')||'0';return neg?'−'+s:s}

function invRow(p){const u=stock(p.id),adm=isAdmin();
 const costCell=money(ucost(p.id));
 const un=unitPres(p)||{};
 const priceCell=adm?`<div class="pr3">${[1,2,3].map(lv=>`<label>P${lv}<input type="number" min="0" step="any" value="${rv(un['p'+lv])}" onchange="setUnitP('${p.id}',${lv},this.value)" aria-label="Precio ${lv} de venta por unidad"></label>`).join('')}</div>`:([1,2,3].filter(lv=>un['p'+lv]!=null).map(lv=>`P${lv}: ${money(un['p'+lv])}`).join('<br>')||'sin precio');

let kQ={text:'',from:'',to:''};
function abonoEntries(){
 const out=[];
 S.debts.forEach(d=>{(d.payments||[]).forEach((p,idx)=>{
  out.push({kind:'abono',src:'debt',id:'d'+d.id+'#'+idx,t:p.t,amount:p.amount,refId:d.id,idx,recv:d.type=='r',label:d.type=='r'?'Abono recibido':'Abono pagado',name:d.name,note:d.note||''})})});
 S.loans.forEach(l=>{(l.payments||[]).forEach((p,idx)=>{
  out.push({kind:'abono',src:'loan',id:'l'+l.id+'#'+idx,t:p.t,amount:p.amount,refId:l.id,idx,recv:true,label:'Abono de préstamo',name:l.workerName,note:l.note||'Préstamo a trabajador'})})});
 return out}
function movFiltered(){
 const txt=kQ.text.trim().toLowerCase();
 const a=kQ.from?new Date(kQ.from+'T00:00:00').getTime():null;
 const b=kQ.to?new Date(kQ.to+'T23:59:59.999').getTime():null;
 const all=[...S.mov.map(m=>({kind:'mov',...m})),...abonoEntries()];
 return all.filter(m=>{
  if(a!=null&&m.t<a)return false;
  if(b!=null&&m.t>b)return false;
  if(txt){
   if(m.kind=='abono'){
    if(!m.name.toLowerCase().includes(txt)&&!m.label.toLowerCase().includes(txt))return false
   }else{
    const p=S.products.find(x=>x.id==m.pid),nm=(p?p.name:(m.nm||'')).toLowerCase();
    if(!nm.includes(txt)&&!m.type.toLowerCase().includes(txt)&&!(m.f&&fno(m.f).includes(txt)))return false}}
  return true}).sort((x,y)=>y.t-x.t)}
function movRows(){
 const list=movFiltered();
 return list.map(m=>{
  if(m.kind=='abono'){
   return `<tr><td>${new Date(m.t).toLocaleString('es',{dateStyle:'short',timeStyle:'short'})}</td><td><b>${esc(m.name)}</b></td><td>${esc(m.label)}</td><td class="m">${esc(m.note||'—')}</td><td class="r m">—</td><td class="r ${m.recv?'pos':'neg'}">${m.recv?'+':'−'}${money(m.amount)}</td><td class="r"><button class="l" onclick="printAbono('${m.src}','${m.refId}',${m.idx})">Recibo POS</button></td></tr>`}
  const p=S.products.find(x=>x.id==m.pid);
  return `<tr><td>${new Date(m.t).toLocaleString('es',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(p?p.name:(m.nm||'(eliminado)'))}</td><td>${esc(m.type)}${m.f?' · Fact. '+fno(m.f):''}</td><td>${m.pq} × ${esc(m.pn)}</td><td class="r ${m.u<0?'neg':'pos'}">${m.u>0?'+':''}${m.u}</td><td class="r">${m.tot!=null?money(m.tot):m.cost!=null?money(m.cost):''}</td><td></td></tr>`
 }).join('')||`<tr><td colspan="7">${kQ.text||kQ.from||kQ.to?'No hay movimientos que coincidan con la búsqueda.':'Aún no hay movimientos.'}</td></tr>`}
function filterK(){

function cView(){
 if(!S.products.length)return '<section><p>Primero agrega un producto en Inventario.</p></section>';
 const names=[...S.products].sort((a,b)=>a.name.localeCompare(b.name,'es')).map(p=>`<option value="${esc(p.name)}">`).join('');
 const h=[...S.counts].reverse().map(c=>{const p=S.products.find(x=>x.id==c.pid);return `<tr><td>${new Date(c.t).toLocaleString('es',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(p?p.name:(c.nm||'(eliminado)'))}</td><td class="r">${c.s} u</td><td class="r">${c.c} u</td><td class="r ${c.d<0?'neg':c.d>0?'pos':''}">${c.d>0?'+':''}${c.d} u</td></tr>`}).join('')||'<tr><td colspan="5">Aún no has hecho conteos.</td></tr>';
 return `<section><h2>Conteo físico</h2><p class="m" style="margin-bottom:10px">Elige un producto a la vez, cuenta sus unidades totales en bodega (sin importar si están en caja, paca o sueltas) y aplica el ajuste de una sola vez. El sistema organiza el total contado según los embalajes del producto.</p><div class="g"><label>Producto<input id="cpn" list="cpl" autocomplete="off" placeholder="Escribe el nombre"><datalist id="cpl">${names}</datalist></label><label>Contado (unidades)<input id="cq" type="number" min="0"></label></div><p id="info"></p><button class="b" id="go">Aplicar ajuste</button></section><section><h2>Conteos anteriores</h2><div class="sc"><table><tr><th>Fecha</th><th>Producto</th><th class="r">En sistema</th><th class="r">Contado</th><th class="r">Diferencia</th></tr>${h}</table></div></section>`}
function wireCount(){
 if(!$('#cpn'))return;
 const sel=()=>findP($('#cpn').value);
 const upd=()=>{
  const p=sel(),v=$('#cq').value;
  if(!p){$('#info').textContent=$('#cpn').value.trim()?'No encuentro ese producto.':'Escribe o selecciona un producto.';return}
  const u=stock(p.id);let t=`En sistema: ${fmt(p,u)} (${u} u)`;
  if(v!==''){const c=Math.max(0,Math.floor(+v)),d=c-u;t+=` · Contado: ${fmt(p,c)} (${c} u) · Diferencia: ${d>0?'+':''}${d} u`}
  $('#info').textContent=t};
 $('#cpn').oninput=upd;$('#cq').oninput=upd;upd();
 $('#go').onclick=()=>{
  const p=sel();if(!p)return msg('Escribe o selecciona un producto válido.');
  const v=$('#cq').value;if(v==='')return msg('Escribe el total contado en unidades.');
  const c=Math.max(0,Math.floor(+v)),s=stock(p.id),d=c-s;
  const apply=async()=>{
   try{

function cashAllTime(){
 let I=0,E=0;
 S.inv.forEach(f=>{const pay=f.pay||{cash:f.total,transfer:0,credit:0};I+=(pay.cash||0)+(pay.transfer||0)});
 S.mov.forEach(m=>{if(m.type=='Compra'&&m.cost!=null)E+=Math.max(0,m.cost-(m.retention||0))});
 S.cash.forEach(c=>{if(c.k=='in')I+=c.a;else E+=c.a});
 return{in:I,out:E,net:I-E}}
function inventoryValue(){return S.products.reduce((a,p)=>{const u=stock(p.id),c=ucost(p.id);return a+(c!=null?u*c:0)},0)}
function receivablesTotal(){return S.debts.filter(d=>d.type=='r').reduce((a,d)=>a+debtCalc(d).balance,0)}
function payablesTotal(){return S.debts.filter(d=>d.type=='p').reduce((a,d)=>a+debtCalc(d).balance,0)}
const PL_EXCLUDE=new Set(['Cobro de deuda','Pago de deuda','Devolución en efectivo','Devolución por transferencia','Anulación de factura (efectivo)','Anulación de factura (transferencia)']);
function incomeStatement(from,to){
 const a=new Date(from+'T00:00:00').getTime(),b=new Date(to+'T23:59:59.999').getTime();
 let ventasBrutas=0,devoluciones=0,cogs=0,nomina=0,otrosGastos=0,otrosIngresos=0;
 S.inv.forEach(f=>{if(f.t>=a&&f.t<=b)ventasBrutas+=f.total});
 S.mov.forEach(m=>{
  if(m.t<a||m.t>b)return;
  if(m.type=='Venta')cogs+=(-m.u)*(ucost(m.pid)||0);
  else if(m.type=='Devolución'){devoluciones+=(m.tot||0);cogs-=m.u*(ucost(m.pid)||0)}});
 S.cash.forEach(c=>{
  if(c.t<a||c.t>b)return;
  if(c.c=='Nómina'){nomina+=c.a;return}
  if(PL_EXCLUDE.has(c.c))return;
  if(c.k=='out')otrosGastos+=c.a;else otrosIngresos+=c.a});
 const ventasNetas=ventasBrutas-devoluciones,utilidadBruta=ventasNetas-cogs,gastosOperativos=nomina+otrosGastos,utilidadNeta=utilidadBruta+otrosIngresos-gastosOperativos;
 return{ventasBrutas,devoluciones,ventasNetas,cogs,utilidadBruta,nomina,otrosGastos,gastosOperativos,otrosIngresos,utilidadNeta}}

async function issue(){
 if(!C.lines.length)return msg('Agrega al menos un producto a la factura.');
 const total=C.lines.reduce((a,l)=>a+l.sub,0),cliente=C.cliente.trim(),vendor=C.vendor.trim();
 if(!cliente)return msg('Escribe el nombre del cliente que compró.');
 if(!vendor)return msg('Escribe el nombre del vendedor/trabajador que atendió la venta.');
 const ret=Math.max(0,+($('#payRet')?$('#payRet').value:0)||0);
 if(ret>total+0.004)return msg('La retención en la fuente no puede ser mayor al total de la factura ('+money(total)+').');
 let pay;
 if(C.pm=='cash')pay={cash:total-ret,transfer:0,credit:0,retention:ret};
 else if(C.pm=='transfer')pay={cash:0,transfer:total-ret,credit:0,retention:ret};
 else if(C.pm=='credit'){pay={cash:0,transfer:0,credit:total-ret,retention:ret}}
 else{
  const c=+$('#payCash').value||0,tr=+$('#payTransfer').value||0,cr=+$('#payCreditAmt').value||0;
  if(Math.round((c+tr+cr+ret)*100)!=Math.round(total*100))return msg('La suma de efectivo, transferencia, crédito y retención debe ser igual al total de la factura ('+money(total)+').');
  if(cr>0&&!cliente)return msg('Escribe el nombre del cliente: lo necesitas para registrar la parte a crédito en Deudas.');
  pay={cash:c,transfer:tr,credit:cr,retention:ret}}
 const tv=$('#payTerm')?$('#payTerm').value:'',term=tv!==''?Math.max(0,Math.floor(+tv)):null;
 const lines=C.lines.slice(),t=Date.now();
 let n,okMsg=null,invObj;
 try{
  await runTransaction(db,async tx=>{
   const cfgRef=doc(db,'config','main');
   const cfgSnap=await tx.get(cfgRef);
   const seq=(cfgSnap.exists()&&cfgSnap.data().invoiceSeq)||0;
   n=seq+1;
   tx.update(cfgRef,{invoiceSeq:n});
   const invRef=doc(collection(db,'invoices'));
   const items=lines.map(l=>({name:l.name,pn:l.pn,q:l.q,sub:l.sub}));
   invObj={n,t,cl:cliente,vendor,items,total,pay};
   tx.set(invRef,invObj);
   lines.forEach(l=>{
    const mRef=doc(collection(db,'movements'));
    tx.set(mRef,{t,pid:l.pid,nm:l.name,type:'Venta',pn:l.pn,pq:l.q,u:-l.u,tot:l.sub,f:n})});
   if(pay.credit>0){
    const dRef=doc(collection(db,'debts'));
    tx.set(dRef,{type:'r',name:cliente,amount:pay.credit,date:t,term,note:`Venta a crédito · Factura N° ${fno(n)}`,payments:[],f:n})}
  });
  if(pay.credit>0)okMsg=pay.credit>=total?`Factura N° ${fno(n)} emitida. "${cliente}" quedó registrado en Deudas por ${money(total)}.`:`Factura N° ${fno(n)} emitida. "${cliente}" pagó ${money(total-pay.credit)} y quedó registrado en Deudas por ${money(pay.credit)}.`;
  if(ret>0.004)okMsg=(okMsg?okMsg+' ':`Factura N° ${fno(n)} emitida. `)+`Se registró una retención en la fuente de ${money(ret)}.`;
  C.lines=[];C.cliente='';C.vendor='';C.pm='cash';C.pc='';C.pt='';C.pcr='';C.pterm='';C.ret='';C.retOn=false;C.retPct='';
  if(okMsg)msg(okMsg);
  render();printInvoice(invObj)
 }catch(e){showErr(e)}}

 if(method=='debt'&&!debt)return msg('No encuentro una deuda asociada a esta factura.');

   if(dRef)tx.update(dRef,{amount:dSnap.data().amount-total});
   if(method=='cash'||method=='transfer'){

  });

function canCancelInvoice(n){

 if(returnedTotalForInvoice(n)>0)return false;
 const pay=f.pay||{cash:f.total,transfer:0,credit:0};
 if(pay.credit>0){
  const debt=linkedDebtForInvoice(n);
  if(!debt||debtCalc(debt).paid>0.01)return false}
 return true}
function cancelInvoice(n){
 if(!isAdmin())return;
 const f=S.inv.find(x=>x.n==n);if(!f)return;
 if(!canCancelInvoice(n))return msg('Esta factura ya tiene devoluciones o abonos registrados; usa el botón "Devolución" para ajustarla.');
 const pay=f.pay||{cash:f.total,transfer:0,credit:0};
 ask(`¿Anular por completo la factura N° ${fno(n)} de "${f.cl||'Cliente de mostrador'}" por ${money(f.total)}? Se repondrá todo el inventario y se revertirá el pago tal como se recibió. Esta acción no se puede deshacer.`,async()=>{
  try{

     dRef=doc(db,'debts',debt.id);dSnap=await tx.get(dRef);
     if(!dSnap.exists())throw new Error('No encuentro la deuda asociada a esta factura.')}
    lines.forEach(l=>{

     tx.set(mRef,{t,pid:l.pid,nm:l.name,type:'Devolución',pn:l.pn,pq:l.maxQ,u:Math.round(l.maxQ*l.unitsPerPres),tot:Math.round(l.maxQ*l.unitPrice*100)/100,f:n,ref:l.movId,reason:'Factura anulada'})});
    if(dRef)tx.update(dRef,{amount:Math.max(0,dSnap.data().amount-pay.credit)});
    if(pay.cash>0){const r=doc(collection(db,'cash'));tx.set(r,{t,k:'out',c:'Anulación de factura (efectivo)',a:pay.cash,f:n})}
    if(pay.transfer>0){const r=doc(collection(db,'cash'));tx.set(r,{t,k:'out',c:'Anulación de factura (transferencia)',a:pay.transfer,f:n})}
   });
   msg('Factura N° '+fno(n)+' anulada: el inventario y el dinero se revirtieron.');
   render()
  }catch(e){showErr(e)}})}

let EX=null;
function openExchange(n){
 if(!isAdmin())return;
 const f=S.inv.find(x=>x.n==n);if(!f)return;
 const lines=saleLinesForInvoice(n).filter(l=>l.maxQ>0||l.already>0);
 if(!lines.some(l=>l.maxQ>0))return msg('Ya se devolvió todo lo de esta factura.');
 EX={n,lines,retQty:lines.map(()=>0),newLines:[],cl:f.cl||'',vendor:f.vendor||(session?session.name:'')};
 renderExchange()}
function exRetPicks(){
 if(!EX)return[];
 return EX.lines.map((l,i)=>({...l,q:EX.retQty[i]||0})).filter(x=>x.q>0)}
function exRetTotal(){return exRetPicks().reduce((a,l)=>a+l.q*l.unitPrice,0)}
function exNewTotal(){return EX?EX.newLines.reduce((a,l)=>a+l.sub,0):0}
function exAvail(id){return EX?stock(id)-EX.newLines.filter(l=>l.pid==id).reduce((a,l)=>a+l.u,0):stock(id)}
function exPayHtml(diff,debt,debtBal){
 if(diff>0.004)return`<label>El cliente paga la diferencia (${money(diff)}) con<select id="xpayMethod"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option><option value="credit">Crédito (queda debiendo esa diferencia)</option></select></label>`;
 if(diff<-0.004)return`<label>Hay que devolverle ${money(-diff)} al cliente, por<select id="xpayMethod"><option value="cash">Efectivo</option><option value="transfer">Transferencia</option>${debt&&debtBal>0?`<option value="debt">Descontar de lo que debe de la factura original (saldo: ${money(debtBal)})</option>`:''}</select></label>`;
 return''}
function updExchangeSummary(){
 if(!EX)return;
 const retTot=exRetTotal(),newTot=exNewTotal(),diff=Math.round((newTot-retTot)*100)/100;
 const debt=linkedDebtForInvoice(EX.n),debtBal=debt?debtCalc(debt).balance:0;
 const sumEl=$('#exSummary');
 if(sumEl)sumEl.textContent=`Total devuelto: ${money(retTot)} · Total nuevo: ${money(newTot)} · ${diff>0.004?'Cliente paga: '+money(diff):diff<-0.004?'Se le devuelve: '+money(-diff):'Cambio exacto, sin diferencia de dinero'}`;
 const payWrap=$('#exPayWrap');
 if(payWrap)payWrap.innerHTML=exPayHtml(diff,debt,debtBal)}
function syncExchangeRet(i){
 if(!EX)return;
 const e=$('#xrq'+i);if(!e)return;
 EX.retQty[i]=Math.max(0,Math.min(EX.lines[i].maxQ,Math.floor(+e.value||0)));
 updExchangeSummary()}
function wireExchangeMini(){

  $('#xmpr').innerHTML=p.pres.map((x,i)=>`<option value="${i}">${esc(x.n)} (${x.q} u)</option>`).join('')};
 const fillLvl=()=>{
  const p=sel();
  if(!p){$('#xmplvl').innerHTML='';return}
  const v=$('#xmpr').value,x=p.pres[v];if(!x){$('#xmplvl').innerHTML='';return}
  const o=[];
  if(x.p1!=null)o.push(`<option value="1">Precio 1 (${money(x.p1)})</option>`);
  if(x.p2!=null)o.push(`<option value="2">Precio 2 (${money(x.p2)})</option>`);
  if(x.p3!=null)o.push(`<option value="3">Precio 3 (${money(x.p3)})</option>`);
  o.push('<option value="manual">Otro (manual)</option>');
  $('#xmplvl').innerHTML=o.join('')};
 const price=()=>{
  const p=sel();if(!p)return;
  const v=$('#xmpr').value,x=p.pres[v];if(!x)return;
  const lvl=$('#xmplvl').value;
  $('#xmpp').value=lvl!='manual'&&x['p'+lvl]!=null?x['p'+lvl]:''};
 const upd=()=>{
  const p=sel();

  $('#xmst').value=pp!==''?money(q*pp):'';
  $('#xinfo').textContent=(x?`${q} × ${x.n}`:'Elige una presentación')+` · Stock disponible: ${exAvail(p.id)} u`};
 $('#xmp').oninput=()=>{fill();fillLvl();price();upd()};
 $('#xmpr').onchange=()=>{fillLvl();price();upd()};
 $('#xmplvl').onchange=()=>{price();upd()};
 $('#xmq').oninput=upd;
 fill();fillLvl();price();upd()}

 if(pp==='')return msg('Escribe el precio de venta.');

 EX.newLines.splice(i,1);

function renderExchange(){
 if(!EX)return;
 const retRows=EX.lines.map((l,i)=>`<tr><td>${esc(l.name)}<div class="m">${esc(l.pn)} · vendidas ${l.soldQ}${l.already?' · ya devueltas '+l.already:''}</div></td><td class="r">${money(l.unitPrice)}</td><td class="r"><input type="number" min="0" max="${l.maxQ}" value="${EX.retQty[i]||0}" id="xrq${i}" style="width:80px" ${l.maxQ?'':'disabled'} oninput="syncExchangeRet(${i})"></td></tr>`).join('');
 const newRows=EX.newLines.map((l,i)=>`<tr><td>${esc(l.name)}</td><td>${l.q} × ${esc(l.pn)}</td><td class="r">${money(l.p)}</td><td class="r">${money(l.sub)}</td><td class="r"><button class="l" onclick="delExchangeLine(${i})">Quitar</button></td></tr>`).join('')||'<tr><td colspan="5">Aún no has agregado lo que se lleva a cambio.</td></tr>';
 openModal(`<h2 style="margin-top:0">Cambio · Factura N° ${fno(EX.n)}</h2><p class="m" style="margin-bottom:10px">Registra lo que el cliente devuelve y lo que se lleva a cambio. El valor de lo devuelto se descuenta de lo nuevo; solo se paga o se devuelve la diferencia. Se crea una factura nueva para lo que se lleva, y la devolución queda sobre la factura original.</p>

<h3 style="margin-top:16px">Lo que se lleva a cambio</h3>

<div class="sc"><table><tr><th>Producto</th><th>Cantidad</th><th class="r">Precio</th><th class="r">Subtotal</th><th></th></tr>${newRows}</table></div>
<p id="exSummary" style="margin-top:10px;font-weight:600"></p>
<div id="exPayWrap" class="g" style="margin-top:4px"></div>
<div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="confirmExchange()">Registrar cambio</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 wireExchangeMini();
 updExchangeSummary()}
async function confirmExchange(){
 if(!isAdmin()||!EX)return;
 const retPicks=exRetPicks();
 if(!retPicks.length)return msg('Marca al menos una cantidad a devolver.');
 if(!EX.newLines.length)return msg('Agrega al menos un producto que el cliente se lleve a cambio.');
 const n=EX.n,retTot=Math.round(exRetTotal()*100)/100,newTot=Math.round(exNewTotal()*100)/100,diff=Math.round((newTot-retTot)*100)/100;
 const debt=linkedDebtForInvoice(n),debtBal=debt?debtCalc(debt).balance:0;
 const payMethod=Math.abs(diff)>0.004?($('#xpayMethod')?$('#xpayMethod').value:'cash'):null;
 if(diff<-0.004&&payMethod=='debt'&&(!debt||debtBal<(-diff)-0.01))return msg('No hay suficiente saldo pendiente en la factura original para descontar esa diferencia.');
 const t=Date.now();
 let n2,invObj;
 try{
  await runTransaction(db,async tx=>{
   const cfgRef=doc(db,'config','main');
   const cfgSnap=await tx.get(cfgRef);
   const seq=(cfgSnap.exists()&&cfgSnap.data().invoiceSeq)||0;
   n2=seq+1;
   tx.update(cfgRef,{invoiceSeq:n2});
   let dRef=null,dSnap=null;
   if(diff<-0.004&&payMethod=='debt'){
    dRef=doc(db,'debts',debt.id);dSnap=await tx.get(dRef);
    if(!dSnap.exists())throw new Error('No encuentro la deuda de la factura original.')}
   retPicks.forEach(l=>{
    const mRef=doc(collection(db,'movements'));
    tx.set(mRef,{t,pid:l.pid,nm:l.name,type:'Devolución',pn:l.pn,pq:l.q,u:Math.round(l.q*l.unitsPerPres),tot:Math.round(l.q*l.unitPrice*100)/100,f:n,ref:l.movId,reason:'Cambio · ver factura nueva N° '+fno(n2)})});
   const invRef=doc(collection(db,'invoices'));
   const items=EX.newLines.map(l=>({name:l.name,pn:l.pn,q:l.q,sub:l.sub}));
   const pay={cash:0,transfer:0,credit:0};
   if(diff>0.004){
    if(payMethod=='transfer')pay.transfer=diff;else if(payMethod=='credit')pay.credit=diff;else pay.cash=diff}
   invObj={n:n2,t,cl:EX.cl.trim()||'Cliente de mostrador',vendor:EX.vendor.trim()||'—',items,total:newTot,pay,exchangeFor:n};
   tx.set(invRef,invObj);
   EX.newLines.forEach(l=>{
    const mRef=doc(collection(db,'movements'));
    tx.set(mRef,{t,pid:l.pid,nm:l.name,type:'Venta',pn:l.pn,pq:l.q,u:-l.u,tot:l.sub,f:n2})});
   if(diff>0.004&&payMethod=='credit'){
    const ndRef=doc(collection(db,'debts'));
    tx.set(ndRef,{type:'r',name:invObj.cl,amount:diff,date:t,term:null,note:`Diferencia de cambio · Factura N° ${fno(n2)}`,payments:[],f:n2})}
   if(diff<-0.004){
    if(payMethod=='debt'&&dRef){
     tx.update(dRef,{amount:Math.max(0,dSnap.data().amount-(-diff))})
    }else{
     const cRef=doc(collection(db,'cash'));
     tx.set(cRef,{t,k:'out',c:payMethod=='transfer'?'Devolución por transferencia':'Devolución en efectivo',a:-diff,f:n})}}
  });
  closeModal();EX=null;
  msg(`Cambio registrado: se creó la factura N° ${fno(n2)} por lo nuevo.`+(diff>0.004?' El cliente pagó la diferencia de '+money(diff)+'.':diff<-0.004?(payMethod=='debt'?' Se descontaron '+money(-diff)+' de lo que debía de la factura original.':' Se le devolvieron '+money(-diff)+'.'):' Sin diferencia de dinero.'));
  render();
  if(invObj)printInvoice(invObj)
 }catch(e){showErr(e)}}

function payCalc(){
 const w=S.workers.find(x=>x.id==$('#lw').value);if(!w)return null;
 const dias=Math.min(30,Math.max(0,+$('#ld').value||0)),vd=w.salary/30;

 const hp=w.hp!==false,extras=+$('#he').value||0,oi=+$('#oi').value||0,od=+$('#od').value||0,ded=hp?(+$('#ded').value||0):0;
 const devengado=sal+ta+extras+oi,deducciones=ded+od;
 return{w,dias,sal,ta,extras,oi,od,devengado,hp,ded,deducciones,neto:devengado-deducciones}}

function wireNLiq(){
 if(!$('#lw'))return;

  const w=S.workers.find(x=>x.id==$('#lw').value),wrap=$('#dedWrap');

  const c=payCalc();if(!c)return;
  $('#info').innerHTML=`Salario proporcional (${c.dias} días): <b>${money(c.sal)}</b><br>Auxilio de transporte: <b>${money(c.ta)}</b><br>Horas extra: <b>${money(c.extras)}</b><br>Otros ingresos: <b>${money(c.oi)}</b><br>Total devengado: <b>${money(c.devengado)}</b><br>Salud y pensión${c.hp?'':' — no aplica a este trabajador'}: <b class="neg">${money(c.ded)}</b><br>Otros descuentos: <b class="neg">${money(c.od)}</b><br>Neto a pagar: <b>${money(c.neto)}</b>`};
 ['#lw','#ld','#he','#oi','#od','#ded'].forEach(s=>{const e=$(s);e.oninput=upd;e.onchange=upd});
 upd();
 $('#go').onclick=async()=>{
  const c=payCalc();if(!c)return msg('Selecciona un trabajador.');

   await runTransaction(db,async tx=>{

   });

  }catch(e){showErr(e)}}}

const DAY=86400000;
function debtCalc(d){const paid=d.payments.reduce((a,p)=>a+p.amount,0);return{paid,balance:d.amount-paid}}
function dueInfo(d){if(d.term==null)return null;const due=d.date+d.term*DAY;return{due,left:Math.ceil((due-Date.now())/DAY)}}
function sortDebts(arr){
 return[...arr].sort((a,b)=>{
  const pa=debtCalc(a).balance<=0.01,pb=debtCalc(b).balance<=0.01;if(pa!=pb)return pa?1:-1;
  const ia=dueInfo(a),ib=dueInfo(b);if(ia&&ib)return ia.left-ib.left;if(ia)return -1;if(ib)return 1;return a.date-b.date})}
function dAlerts(){return S.debts.filter(d=>{const c=debtCalc(d),inf=dueInfo(d);return c.balance>0.01&&inf&&inf.left<=3}).sort((a,b)=>dueInfo(a).left-dueInfo(b).left)}
function dRow(d){

 if(!inf)vence='<span class="m">Sin plazo</span>';
 else{const f=new Date(inf.due).toLocaleDateString('es');
  if(pagado)vence=`<span class="m">${f}</span>`;
  else if(inf.left<0)vence=`<b class="neg">Venció hace ${-inf.left} día(s)</b><div class="m">${f}</div>`;
  else if(inf.left==0)vence=`<b class="neg">Vence hoy</b><div class="m">${f}</div>`;
  else if(inf.left<=3)vence=`<b style="color:var(--ac)">Vence en ${inf.left} día(s)</b><div class="m">${f}</div>`;
  else vence=`En ${inf.left} días<div class="m">${f}</div>`}
 const abonoCell=pagado?'<span class="pos">Pagado</span>':(adm?`<input type="number" min="0" max="${c.balance}" step="any" id="ab${d.id}" placeholder="Abono" style="width:90px;display:inline-block"> <button class="l" onclick="addAbono('${d.id}')">Registrar</button>`:'<span class="m">—</span>');
 return `<tr><td><b>${esc(d.name)}</b>${d.note?`<div class="m">${esc(d.note)}</div>`:''}</td><td class="m">${new Date(d.date).toLocaleDateString('es')}</td><td>${vence}</td><td class="r">${money(d.amount)}</td><td class="r">${money(c.paid)}</td><td class="r ${pagado?'pos':'neg'}"><b>${money(c.balance)}</b></td><td class="r">${abonoCell}</td>${adm?`<td class="r"><button class="l" onclick="delDebt('${d.id}')">Eliminar</button></td>`:''}</tr>`}

 return `<section><h2>Deudas y deudores</h2>${alertHtml}<div class="kp"><div><span class="m">Total por cobrar</span><b class="pos">${money(totR)}</b></div><div><span class="m">Total por pagar</span><b class="neg">${money(totP)}</b></div><div><span class="m">Balance neto</span><b class="${totR-totP<0?'neg':'pos'}">${money(totR-totP)}</b></div></div></section>

    for(const f of d.inv||[]){await addDoc(collection(db,'invoices'),{n:f.n,t:f.t,cl:f.cl,vendor:f.vendor||null,items:f.items,total:f.total,pay:f.pay})}
    for(const w of d.workers||[]){await addDoc(collection(db,'workers'),{name:w.name,salary:w.salary,transport:w.transport,hp:w.hp,docType:w.docType||null,docNum:w.docNum||null,birth:w.birth||null})}

   }catch(e){showErr(e)}})};
 r.readAsText(file)}

async function doWipeAll(){
 if(!isSuperAdmin())return;
 const box=$('#wipeConfirm');if(!box)return;
 if(box.value.trim().toUpperCase()!=='ELIMINAR'){$('#wipeInfo').textContent='Escribe ELIMINAR para confirmar.';return}
 closeModal();
 msg('Eliminando todos los datos… esto puede tardar un momento, no cierres esta ventana.');
 const cols=['products','cash','counts','invoices','workers','payroll','debts','loans','movements'];
 const failed=[];
 for(const col of cols){
  try{
   const snap=await getDocs(collection(db,col));
   for(const d of snap.docs){await deleteDoc(doc(db,col,d.id))}
  }catch(e){console.error(e);failed.push(col)}
 }
 try{await setDoc(doc(db,'config','main'),{invoiceSeq:0,payrollSeq:0},{merge:true})}catch(e){console.error(e)}
 if(failed.includes('movements'))
  msg('Se eliminaron los datos, pero el historial de movimientos no se pudo borrar: debes actualizar las reglas de Firestore (ver instrucciones) para poder borrarlo.');
 else if(failed.length)
  msg('Se eliminaron los datos, pero algo falló al borrar: '+failed.join(', ')+'.');
 else
  msg('Todos los datos fueron eliminados. Las cuentas de usuario se conservaron.');
 render()
}

function splitAmount(total,weights){
 const sumW=weights.reduce((a,b)=>a+b,0);
 if(!(sumW>0))return weights.map(()=>0);
 let acc=0;
 return weights.map((w,i)=>{
  if(i==weights.length-1)return Math.round((total-acc)*100)/100;
  const v=Math.round(total*w/sumW*100)/100;
  acc+=v;
  return v})}

ass="b" onclick="confirmEntrada()">Registrar entrada</button></p></section>

async function confirmEntrada(){
 if(!isAdmin())return;
 if(!E.lines.length)return msg('Agrega al menos un producto a esta compra.');
 const total=Math.round(E.lines.reduce((a,l)=>a+l.sub,0)*100)/100;
 const provName=$('#eprov').value.trim(),payType=$('#epay').value,provTerm=$('#eprt').value;
 if(payType=='credit'&&!provName)return msg('Escribe a quién le debes esta compra.');
 const ret=Math.max(0,+($('#eret')?$('#eret').value:0)||0);
 if(ret>0.004&&!provName)return msg('Escribe el nombre del proveedor: lo necesitas para poder reportar la retención por proveedor.');
 if(ret>total+0.004)return msg('La retención en la fuente no puede ser mayor al total de la compra ('+money(total)+').');
 const lines=E.lines.slice(),t=Date.now();
 const retShares=splitAmount(Math.round(ret*100)/100,lines.map(l=>l.sub));
 let n,owed=0;
 try{
  await runTransaction(db,async tx=>{
   const cfgRef=doc(db,'config','main');
   const cfgSnap=await tx.get(cfgRef);
   const seq=(cfgSnap.exists()&&cfgSnap.data().entradaSeq)||0;
   n=seq+1;
   tx.update(cfgRef,{entradaSeq:n});
   lines.forEach((l,i)=>{
    let pid=l.pid;
    if(l.isNew){
     const pRef=doc(collection(db,'products'));
     tx.set(pRef,{name:l.name,pres:[{n:'Unidad',q:1,p1:l.p1,p2:l.p2,p3:l.p3}],cost:l.unitCost});
     pid=pRef.id
    }else{
     const updates={cost:l.unitCost};
     if(l.p1!=null||l.p2!=null||l.p3!=null){
      const p=S.products.find(x=>x.id==l.pid);
      if(p){
       const pres=p.pres.map(x=>({...x})),u=pres.find(x=>x.q==1);
       if(u){if(l.p1!=null)u.p1=l.p1;if(l.p2!=null)u.p2=l.p2;if(l.p3!=null)u.p3=l.p3}
       else pres.unshift({n:'Unidad',q:1,p1:l.p1,p2:l.p2,p3:l.p3});
       updates.pres=pres}}
     tx.update(doc(db,'products',l.pid),updates)}
    const mRef=doc(collection(db,'movements'));
    tx.set(mRef,{t,pid,nm:l.name,type:'Compra',pn:'Unidad',pq:l.q,u:l.q,tot:null,cost:l.sub,retention:retShares[i]||0,prov:provName||null,pf:n})
   });
   if(payType=='credit'){
    owed=Math.max(0,Math.round((total-ret)*100)/100);
    if(owed>0.004){
     const dRef=doc(collection(db,'debts'));
     const itemsTxt=lines.map(l=>`${l.q}×${l.name}`).join(', ');
     tx.set(dRef,{type:'p',name:provName,amount:owed,date:t,term:provTerm!==''?Math.max(0,Math.floor(+provTerm)):null,note:`Entrada N° ${String(n).padStart(4,'0')}: ${itemsTxt}`+(ret>0.004?` · Retención: ${money(ret)}`:''),payments:[],f:n})}}
  });
  const debtMsg=(payType=='credit'&&owed>0.004)?` Se registró una sola deuda con ${provName} por ${money(owed)} (Entrada N° ${String(n).padStart(4,'0')}).`:'';
  const retMsg=ret>0.004?' Se registró una retención en la fuente de '+money(ret)+'.':'';
  msg(`Entrada N° ${String(n).padStart(4,'0')} registrada con ${lines.length} producto${lines.length>1?'s':''}.`+debtMsg+retMsg);
  E.lines=[];E.prov='';E.pay='cash';E.term='';E.retOn=false;E.retPct='';E.ret='';
  render()
 }catch(e){showErr(e)}}

function openModal(html){$('#mdBox').innerHTML=html;$('#mdBg').hidden=false}
function closeModal(){$('#mdBg').hidden=true;$('#mdBox').innerHTML=''}
function adjustCost(id){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id);if(!p)return;
 const cur=ucost(id);
 openModal(`<h2 style="margin-top:0">Ajustar costo: ${esc(p.name)}</h2><p class="m" style="margin-bottom:10px">Usa esto cuando el costo cambie sin que hayas comprado mercancía nueva (por ejemplo, el proveedor avisa un alza de precio). No afecta el stock ni registra una entrada, solo actualiza el costo de referencia del producto.</p><p class="m" style="margin-bottom:10px">Costo actual: <b>${cur!=null?money(cur):'sin costo registrado'}</b></p><div class="g" style="grid-template-columns:1fr"><label>Nuevo costo unitario<input id="acV" type="number" min="0" step="any" value="${cur!=null?rv(cur):''}"></label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="confirmAdjustCost('${id}')">Guardar ajuste</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#acV');if(e){e.focus();e.select()}},0)}
async function confirmAdjustCost(id){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id);if(!p)return;
 const v=$('#acV')?$('#acV').value:'';
 if(v==='')return msg('Escribe el nuevo costo unitario.');
 const nc=Math.max(0,+v);
 try{
  await updateDoc(doc(db,'products',id),{cost:nc});
  await addDoc(collection(db,'movements'),{t:Date.now(),pid:id,nm:p.name,type:'Ajuste de costo',pn:'Unidad',pq:0,u:0,tot:null,cost:nc});
  closeModal();msg(`Costo de "${p.name}" ajustado a ${money(nc)}.`);render()
 }catch(e){showErr(e)}}
function pickP(id){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id);if(!p)return;
 openModal(`<h2 style="margin-top:0">Embalar: ${esc(p.name)}</h2><p class="m" style="margin-bottom:10px">Define cómo vendes este producto: por paca, caja u otra presentación. Puedes definir hasta 3 precios de venta (precio 1, 2 y 3) para elegir cuál usar al vender; precio 1 es obligatorio, 2 y 3 son opcionales. El precio de la unidad se cambia en la tabla de Productos y stock. Si ya existe una presentación con las mismas unidades, se actualiza.</p><div class="g"><label>Presentación<input id="bn" placeholder="Ej. Paca"></label><label>Unidades que trae<input id="bq" type="number" min="1"></label></div><div class="g"><label>Precio 1<input id="bpr1" type="number" min="0"></label><label>Precio 2 (opcional)<input id="bpr2" type="number" min="0"></label><label>Precio 3 (opcional)<input id="bpr3" type="number" min="0"></label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="embalar('${id}')">Guardar presentación</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#bn');if(e)e.focus()},0)}
async function embalar(id){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id),n=$('#bn').value.trim(),q=Math.floor(+$('#bq').value),pr1=$('#bpr1').value,pr2=$('#bpr2').value,pr3=$('#bpr3').value;
 if(!p)return msg('No encuentro ese producto.');
 if(!n||!(q>0)||pr1==='')return msg('Escribe el nombre, las unidades que trae y el precio 1.');
 const pres=p.pres.map(x=>({...x})),x=pres.find(z=>z.q==q);
 const p1=+pr1,p2=pr2!==''?+pr2:null,p3=pr3!==''?+pr3:null;
 if(x){x.n=n;x.p1=p1;x.p2=p2;x.p3=p3}else pres.push({n,q,p1,p2,p3});
 pres.sort((a,b)=>a.q-b.q);
 try{await updateDoc(doc(db,'products',id),{pres});closeModal();msg(`Presentación "${n}" (${q} u) guardada en ${p.name}.`);render()}
 catch(e){showErr(e)}}
function delPres(id,i){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id),x=p.pres[i];if(!p||!x)return;
 ask(`¿Quitar la presentación "${x.n}" de ${p.name}?`,async()=>{
  try{const pres=p.pres.filter((_,idx)=>idx!=i);await updateDoc(doc(db,'products',id),{pres});render()}
  catch(e){showErr(e)}})}
function editPres(id,i){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id),x=p&&p.pres[i];if(!p||!x)return;
 openModal(`<h2 style="margin-top:0">Editar presentación: ${esc(p.name)}</h2><p class="m" style="margin-bottom:10px">Corrige el nombre, las unidades que trae o los precios de esta presentación, por si te equivocaste al crearla.</p><div class="g"><label>Presentación<input id="epn" value="${esc(x.n)}"></label><label>Unidades que trae<input id="epq" type="number" min="1" value="${x.q}"></label></div><div class="g"><label>Precio 1<input id="eppr1" type="number" min="0" value="${rv(x.p1)}"></label><label>Precio 2 (opcional)<input id="eppr2" type="number" min="0" value="${rv(x.p2)}"></label><label>Precio 3 (opcional)<input id="eppr3" type="number" min="0" value="${rv(x.p3)}"></label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="confirmEditPres('${id}',${i})">Guardar cambios</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#epn');if(e){e.focus();e.select()}},0)}
async function confirmEditPres(id,i){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id);if(!p||!p.pres[i])return;
 const n=$('#epn').value.trim(),q=Math.floor(+$('#epq').value),pr1=$('#eppr1').value,pr2=$('#eppr2').value,pr3=$('#eppr3').value;
 if(!n||!(q>0)||pr1==='')return msg('Escribe el nombre, las unidades que trae y el precio 1.');
 const dup=p.pres.find((z,idx)=>idx!=i&&z.q==q);
 if(dup)return msg(`Ya existe otra presentación ("${dup.n}") con ${q} unidades. Usa un número distinto.`);
 const pres=p.pres.map(z=>({...z}));
 pres[i]={n,q,p1:+pr1,p2:pr2!==''?+pr2:null,p3:pr3!==''?+pr3:null};
 pres.sort((a,b)=>a.q-b.q);
 try{await updateDoc(doc(db,'products',id),{pres});closeModal();msg(`Presentación "${n}" actualizada en ${p.name}.`);render()}
 catch(e){showErr(e)}}
function renameProduct(id){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id);if(!p)return;
 openModal(`<h2 style="margin-top:0">Editar nombre</h2><p class="m" style="margin-bottom:10px">Cambia el nombre de "${esc(p.name)}". Se actualiza en todo el sistema (Inventario, Ventas, Conteo físico, etc.); las facturas y movimientos ya registrados conservan el nombre que tenían en su momento.</p><div class="g" style="grid-template-columns:1fr"><label>Nombre<input id="rnN" value="${esc(p.name)}"></label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="confirmRenameProduct('${id}')">Guardar</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#rnN');if(e){e.focus();e.select()}},0)}
async function confirmRenameProduct(id){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id);if(!p)return;
 const name=$('#rnN').value.trim();
 if(!name)return msg('Escribe el nombre del producto.');
 const dup=findP(name);
 if(dup&&dup.id!=id)return msg(`Ya existe otro producto llamado "${name}".`);
 try{
  await updateDoc(doc(db,'products',id),{name});
  closeModal();msg(`Nombre actualizado a "${name}".`);render()
 }catch(e){showErr(e)}}
function newProduct(){
 if(!isAdmin())return;
 openModal(`<h2 style="margin-top:0">Nuevo producto</h2><p class="m" style="margin-bottom:10px">Úsalo para una venta rápida cuando el producto todavía no está ingresado. Se crea con 0 unidades en stock: si lo vendes de una vez, el stock quedará en negativo (en rojo) hasta que cuentes la mercancía real en "Conteo físico". Precios y costo son opcionales: puedes completarlos ahora o después, directamente en la tabla de Productos y stock o con "Ajustar costo".</p><div class="g" style="grid-template-columns:1fr"><label>Nombre<input id="npN" placeholder="Nombre del producto"></label></div><div class="g"><label>Precio 1<input id="npP1" type="number" min="0" placeholder="Opcional"></label><label>Precio 2<input id="npP2" type="number" min="0" placeholder="Opcional"></label><label>Precio 3<input id="npP3" type="number" min="0" placeholder="Opcional"></label></div><div class="g" style="grid-template-columns:1fr"><label>Costo unitario<input id="npC" type="number" min="0" placeholder="Opcional"></label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="confirmNewProduct()">Crear producto</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#npN');if(e)e.focus()},0)}
async function confirmNewProduct(){
 if(!isAdmin())return;
 const name=$('#npN').value.trim();
 if(!name)return msg('Escribe el nombre del producto.');
 if(findP(name))return msg(`Ya existe un producto llamado "${name}". Búscalo en Inventario para venderlo o editarlo.`);
 const pr1=$('#npP1').value,pr2=$('#npP2').value,pr3=$('#npP3').value,c=$('#npC').value;
 const priceVal1=pr1!==''?Math.max(0,+pr1):null,priceVal2=pr2!==''?Math.max(0,+pr2):null,priceVal3=pr3!==''?Math.max(0,+pr3):null;
 try{
  await addDoc(collection(db,'products'),{name,pres:[{n:'Unidad',q:1,p1:priceVal1,p2:priceVal2,p3:priceVal3}],...(c!==''?{cost:Math.max(0,+c)}:{})});
  closeModal();msg(`Producto "${name}" creado con 0 unidades en stock. Ya lo puedes vender desde Ventas; ajusta las unidades reales después en "Conteo físico".`);render()
 }catch(e){showErr(e)}}

const rv=n=>n==null?'':Math.round(n*100)/100;
function unitPres(p){return p.pres.find(x=>x.q==1)}
async function setUnitP(id,level,v){
 if(!isAdmin())return;if(v==='')return render();
 const p=S.products.find(x=>x.id==id);if(!p)return;
 const pres=p.pres.map(x=>({...x})),u=pres.find(x=>x.q==1),val=Math.max(0,+v);
 if(u)u['p'+level]=val;else pres.unshift({n:'Unidad',q:1,p1:level==1?val:null,p2:level==2?val:null,p3:level==3?val:null});
 try{await updateDoc(doc(db,'products',id),{pres});msg('Precio '+level+' de venta actualizado.');render()}
 catch(e){showErr(e)}}
async function setPresPrice(id,i,level,v){
 if(!isAdmin())return;if(v==='')return render();
 const p=S.products.find(x=>x.id==id);if(!p)return;
 const pres=p.pres.map(x=>({...x}));pres[i]['p'+level]=Math.max(0,+v);
 try{await updateDoc(doc(db,'products',id),{pres});msg('Precio '+level+' de '+pres[i].n+' actualizado en '+p.name+'.');render()}
 catch(e){showErr(e)}}
let pzSel='';
function updPriceProduct(){
 pzSel=$('#pzn').value;const p=findP(pzSel),e=$('#pzBody');if(!e)return;
 if(!p){e.innerHTML=pzSel.trim()?'<p class="m">No encuentro ese producto.</p>':'';return}
 const idx=[];p.pres.forEach((x,i)=>{if(x.q>1)idx.push(i)});
 if(!idx.length){e.innerHTML=`<p class="m">"${esc(p.name)}" todavía no tiene pacas, cajas u otras presentaciones. Agrégalas en "Embalar un producto" más abajo.</p>`;return}
 e.innerHTML=`<div class="sc"><table><tr><th>Presentación</th><th class="r">Precio 1</th><th class="r">Precio 2</th><th class="r">Precio 3</th></tr>${idx.map(i=>{const x=p.pres[i];return `<tr><td>${esc(x.n)} (${x.q} u)</td>${[1,2,3].map(lv=>`<td class="r"><input type="number" min="0" step="any" value="${rv(x['p'+lv])}" onchange="setPresPrice('${p.id}',${i},${lv},this.value)" aria-label="Precio ${lv}" style="width:90px"></td>`).join('')}</tr>`}).join('')}</table></div>`}
function wirePrices(){if($('#pzn'))updPriceProduct()}
function pricesView(){
 if(!S.products.length)return '<section><h2>Actualizar precios</h2><p class="m">Primero agrega productos en Inventario.</p></section>';
 const names=[...S.products].sort((a,b)=>a.name.localeCompare(b.name,'es')).map(p=>`<option value="${esc(p.name)}">`).join('');
 return `<section><h2>Actualizar precios</h2><p class="m" style="margin-bottom:10px">Elige el producto al que le quieres actualizar los precios 1, 2 y 3 de sus pacas, cajas u otras presentaciones. Los precios de la unidad se cambian arriba, en la tabla de Productos y stock.</p><div class="g"><label>Producto<input id="pzn" list="pzl" autocomplete="off" placeholder="Escribe el nombre" value="${esc(pzSel)}" oninput="updPriceProduct()"><datalist id="pzl">${names}</datalist></label></div><div id="pzBody"></div></section>`}

function render(){
 if(!session){
  document.querySelector('nav').hidden=true;
  $('#sess').innerHTML='';$('#adminTools').hidden=true;
  if(!authReady){$('#v').innerHTML='<section><p class="m">Cargando…</p></section>';return}
  if(cfgHasAdmin===null){$('#v').innerHTML='<section><p class="m">Cargando…</p></section>';checkHasAdmin();return}
  $('#v').innerHTML=cfgHasAdmin?loginView():setupView();
  if(cfgHasAdmin)wireLogin();else wireSetup();
  return}
 document.querySelector('nav').hidden=false;
 const allowed=allowedTabs(session.role);
 if(!allowed.includes(tab))tab=allowed[0];
 document.querySelectorAll('nav button').forEach(b=>{b.hidden=!allowed.includes(b.dataset.t);b.classList.toggle('on',b.dataset.t==tab)});
 $('#sess').innerHTML=`<span class="sessBadge"><span class="sessDot"></span>Conectado como <b>${esc(session.name)}</b> · ${session.role=='admin'?'Administrador':'Vendedor'}</span><button class="l" onclick="changeMyPw()">Cambiar contraseña</button> · <button class="l" onclick="logout()">Cerrar sesión</button>`;
 $('#adminTools').hidden=!isAdmin();
 $('#wipeBtn').hidden=!isSuperAdmin();
 const nb=document.querySelector('nav button[data-t="d"]'),na=(isAdmin()?dAlerts():dAlerts().filter(d=>d.type=='r')).length;
 if(nb)nb.innerHTML='Deudas'+(na?`<span class="bd">${na}</span>`:'');
 $('#v').innerHTML=tab=='inv'?invView():tab=='fc'?fcView():tab=='fac'?facView():tab=='in'?eView():tab=='out'?sView():tab=='k'?kView():tab=='c'?cView():tab=='f'?fView():tab=='n'?nView():tab=='d'?dView():tab=='bg'?bgView():uView();
 if(tab=='in')wireE();if(tab=='c')wireCount();if(tab=='f')wireF();if(tab=='fc')wireFc();if(tab=='n')wireN();if(tab=='inv')wirePrices();if(tab=='bg')wireBg()}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('#mdBg').onclick=e=>{if(e.target.id=='mdBg')closeModal()};
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeModal()});

render();
