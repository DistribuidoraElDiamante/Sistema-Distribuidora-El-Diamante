<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Distribuidora el Diamante (Nube)</title>
<style>
:root{--bg:#eef1f4;--sf:#fff;--tx:#17212b;--mu:#5c6873;--bd:#d5dbe1;--ac:#8a5a14;--tn:#f3e7d3;--ng:#b3261e;--ps:#1d6b43;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--sf:#1c2229;--tx:#e8ecef;--mu:#98a3ad;--bd:#2f3943;--ac:#e0b36a;--tn:#2b2417;--ng:#f2837b;--ps:#6fcf97}}
:root[data-theme="dark"]{--bg:#14181d;--sf:#1c2229;--tx:#e8ecef;--mu:#98a3ad;--bd:#2f3943;--ac:#e0b36a;--tn:#2b2417;--ng:#f2837b;--ps:#6fcf97}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:16px;margin:0 0 12px}
.m{color:var(--mu);font-size:13px;margin:0}
nav{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin:14px 0 16px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:inherit;color:var(--mu);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:600}
section{background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:16px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);vertical-align:top}
th{font-weight:600;color:var(--mu);font-size:13px}
.r{text-align:right}.neg{color:var(--ng)}.pos{color:var(--ps)}
.g,.g3{display:grid;gap:10px;margin-bottom:10px}
.g{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g3{grid-template-columns:2fr 1fr 1fr}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b{background:var(--ac);color:var(--sf);border:0;border-radius:6px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.l{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;padding:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
#info{margin:4px 0 12px;padding:8px 10px;background:var(--tn);border-radius:6px;color:var(--tx)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kp div{border-left:3px solid var(--ac);padding:2px 10px}.kp b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.nt{background:var(--tn);border-radius:6px;padding:10px 12px;margin-bottom:14px}.nt ul{margin:8px 0 0;padding-left:18px}.nt li{margin-bottom:3px}
.bd{background:var(--ng);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;margin-left:4px;font-weight:600}
#ask,#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(92vw,460px);width:max-content;background:var(--sf);color:var(--tx);border:1px solid var(--ac);border-radius:6px;padding:12px 14px;z-index:9}#ask p{margin:0 0 10px}[hidden]{display:none!important}
#mdBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:flex;align-items:center;justify-content:center;padding:16px}
#mdBox{background:var(--sf);color:var(--tx);border-radius:8px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.pos-receipt{font-family:'Courier New',Courier,monospace;font-size:13px;max-width:320px;margin:0 auto;color:var(--tx)}
.pos-c{text-align:center}
.pos-mu{color:var(--mu);font-size:12px}
.pos-hr{border-top:1px dashed var(--bd);margin:8px 0}
.pl-row{display:flex;justify-content:space-between;gap:10px;margin:4px 0}
.pl-row+.pl-row{margin-top:2px}
@media print{
 @page{size:80mm auto;margin:2mm}
 body *{visibility:hidden}
 #mdBox,#mdBox *{visibility:visible}
 #mdBg{position:static;background:none;padding:0}
 #mdBox{position:absolute;left:0;top:0;width:76mm;max-width:76mm;box-shadow:none;border:0;padding:0;background:#fff}
 .pos-receipt{max-width:100%;font-size:11px;color:#000}
 .pos-mu{color:#333}
 .pos-hr{border-top:1px dashed #000}
 #posActions{display:none!important}
}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>Sistema de Distribuidora el Diamante</h1><p class="m">Los datos se guardan en la nube (Firebase) y se sincronizan automáticamente en todos los computadores conectados a internet.</p></div><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><span id="sess" class="m"></span><div id="adminTools" hidden style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><button class="l" onclick="backup()">Guardar copia de seguridad</button><label class="l" style="cursor:pointer;flex-direction:row;color:var(--mu)">Importar copia<input type="file" accept=".json,application/json" hidden onchange="restore(this.files[0]);this.value=''"></label><button class="l" onclick="reset()">Borrar todos los datos del negocio</button></div></div></div>
<nav>
<button data-t="inv">Inventario</button>
<button data-t="fc">Ventas</button>
<button data-t="in">Registrar entrada</button>
<button data-t="out">Salidas</button>
<button data-t="c">Conteo físico</button>
<button data-t="f">Flujo de dinero</button>
<button data-t="n">Nómina</button>
<button data-t="d">Deudas</button>
<button data-t="k">Movimientos</button>
<button data-t="u">Usuarios</button>
</nav>
<div id="v"></div>
</main>
<div id="ask" hidden></div><div id="msg" hidden></div>
<div id="mdBg" hidden><div id="mdBox"></div></div>
<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc, getDocs, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====================================================================
// PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE (Firebase Console > Configuración
// del proyecto > tus apps > el ícono "</>" de la app web > "Config").
// Reemplaza TODO el objeto de abajo por el que copiaste de tu proyecto.
// ====================================================================
const firebaseConfig = {
  apiKey: "AIzaSyD04s1YKLuRIEghKJBcZvzpE6Mqnbp2Xuk",
  authDomain: "distribuidora-el-diamante.firebaseapp.com",
  projectId: "distribuidora-el-diamante",
  storageBucket: "distribuidora-el-diamante.firebasestorage.app",
  messagingSenderId: "348671232695",
  appId: "1:348671232695:web:a9cb2e5ad866f4d71e1b32"
};
// ====================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null?'sin precio':'$'+Math.round(n).toLocaleString('es-CO');
function msg(t){const e=$('#msg');e.textContent=t;e.hidden=false;clearTimeout(msg.h);msg.h=setTimeout(()=>{e.hidden=true},4500)}
function ask(t,fn){const e=$('#ask');e.innerHTML=`<p>${esc(t)}</p><button class="b" id="ay">Sí, continuar</button> <button class="l" id="an">Cancelar</button>`;e.hidden=false;$('#ay').onclick=()=>{e.hidden=true;fn()};$('#an').onclick=()=>{e.hidden=true}}
function showErr(e){console.error(e);msg('Ocurrió un error'+(e&&e.code?(' ('+e.code+')'):'')+'. '+(e&&e.message?e.message:''))}
function toAuthEmail(u){return (u||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@eldiamante.local'}

let S={products:[],mov:[],cash:[],counts:[],inv:[],workers:[],payroll:[],debts:[],users:[],cfg:{transportAux:0,invoiceSeq:0}};
let tab='inv';
let session=null;
let justSignedIn=false;
let authReady=false;
let cfgHasAdmin=null;
let unsubs=[];

function isAdmin(){return !!session&&session.role=='admin'}
function allowedTabs(role){return role=='admin'?['inv','fc','in','out','c','f','n','d','k','u']:['inv','fc','in','out','d']}

function detachListeners(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
function attachListeners(){
 const mk=(name,setter)=>onSnapshot(collection(db,name),snap=>{setter(snap.docs.map(d=>({id:d.id,...d.data()})));render()},e=>showErr(e));
 unsubs.push(mk('products',arr=>S.products=arr));
 unsubs.push(mk('movements',arr=>S.mov=arr));
 unsubs.push(mk('cash',arr=>S.cash=arr));
 unsubs.push(mk('counts',arr=>S.counts=arr));
 unsubs.push(mk('invoices',arr=>S.inv=arr));
 unsubs.push(mk('workers',arr=>S.workers=arr));
 unsubs.push(mk('payroll',arr=>S.payroll=arr));
 unsubs.push(mk('debts',arr=>S.debts=arr));
 if(isAdmin())unsubs.push(mk('users',arr=>S.users=arr));
 unsubs.push(onSnapshot(doc(db,'config','main'),snap=>{S.cfg=snap.exists()?snap.data():{transportAux:0,invoiceSeq:0};render()},e=>showErr(e)));
}
function attachOwnProfileListener(uid){
 unsubs.push(onSnapshot(doc(db,'users',uid),snap=>{
  if(!snap.exists()||snap.data().active===false){msg('Tu acceso fue desactivado.');signOut(auth);return}
  session={id:uid,email:auth.currentUser.email,...snap.data()};render()
 },e=>{}))
}
let bootstrapping=false;
onAuthStateChanged(auth,async user=>{
 if(bootstrapping)return; // doSetupAdmin maneja su propia sesión una vez termina de escribir el perfil
 detachListeners();
 if(!user){session=null;authReady=true;render();return}
 try{
  const snap=await getDoc(doc(db,'users',user.uid));
  if(!snap.exists()||snap.data().active===false){await signOut(auth);msg('Tu cuenta no tiene acceso o fue desactivada.');return}
  session={id:user.uid,email:user.email,...snap.data()};
  authReady=true;cfgHasAdmin=true;
  attachListeners();attachOwnProfileListener(user.uid);
  if(justSignedIn){msg(`Bienvenido, ${session.name}.`);justSignedIn=false}
  render()
 }catch(e){showErr(e)}
});
async function checkHasAdmin(){
 try{const snap=await getDoc(doc(db,'config','main'));cfgHasAdmin=snap.exists()&&snap.data().hasAdmin===true}
 catch(e){cfgHasAdmin=false;showErr(e)}
 render()
}

function setupView(){
 return `<section style="max-width:420px;margin:40px auto"><h2>Configuración inicial</h2><p class="m" style="margin-bottom:12px">Crea la cuenta del administrador principal. Desde esa cuenta podrás crear los perfiles de los vendedores.</p><div class="g" style="grid-template-columns:1fr"><label>Tu nombre<input id="suN" placeholder="Ej. Daniel Usuga"></label><label>Usuario<input id="suU" autocomplete="username"></label><label>Contraseña<input id="suP" type="password" autocomplete="new-password"></label><label>Confirmar contraseña<input id="suP2" type="password" autocomplete="new-password"></label></div><button class="b" id="suGo" style="width:100%">Crear administrador</button></section>`}
function wireSetup(){
 $('#suGo').onclick=doSetupAdmin;
 ['#suN','#suU','#suP','#suP2'].forEach(s=>{$(s).onkeydown=e=>{if(e.key=='Enter')doSetupAdmin()}});
 setTimeout(()=>{const e=$('#suN');if(e)e.focus()},0)}
async function doSetupAdmin(){
 const name=$('#suN').value.trim(),username=$('#suU').value.trim(),p=$('#suP').value,p2=$('#suP2').value;
 if(!name||!username)return msg('Escribe tu nombre y un nombre de usuario.');
 if(!p||p.length<4)return msg('Escribe una contraseña de al menos 4 caracteres.');
 if(p!=p2)return msg('Las contraseñas no coinciden.');
 const email=toAuthEmail(username);
 if(email=='@eldiamante.local')return msg('Escribe un usuario válido (letras y números).');
 bootstrapping=true;
 try{
  const cred=await createUserWithEmailAndPassword(auth,email,p);
  await runTransaction(db,async tx=>{
   const cfgRef=doc(db,'config','main');
   const cfgSnap=await tx.get(cfgRef);
   if(cfgSnap.exists()&&cfgSnap.data().hasAdmin===true)throw new Error('Ya existe un administrador.');
   tx.set(doc(db,'users',cred.user.uid),{name,username,role:'admin',active:true});
   tx.set(cfgRef,{hasAdmin:true,transportAux:(cfgSnap.exists()?cfgSnap.data().transportAux||0:0),invoiceSeq:(cfgSnap.exists()?cfgSnap.data().invoiceSeq||0:0)});
  });
  session={id:cred.user.uid,email,name,username,role:'admin',active:true};
  authReady=true;cfgHasAdmin=true;
  attachListeners();attachOwnProfileListener(cred.user.uid);
  msg(`Cuenta de administrador creada. Bienvenido, ${name}.`);
  render()
 }catch(e){
  if(e.code=='auth/email-already-in-use')msg('Ya existe un usuario con ese nombre de usuario.');
  else{try{await signOut(auth)}catch(e2){}showErr(e)}
 }finally{bootstrapping=false}}
function loginView(){
 return `<section style="max-width:380px;margin:40px auto"><h2>Iniciar sesión</h2><p class="m" style="margin-bottom:12px">Ingresa tu usuario y contraseña para entrar al sistema.</p><div class="g" style="grid-template-columns:1fr"><label>Usuario<input id="luU" autocomplete="username"></label><label>Contraseña<input id="luP" type="password" autocomplete="current-password"></label></div><button class="b" id="luGo" style="width:100%">Entrar</button></section>`}
function wireLogin(){
 $('#luGo').onclick=doLogin;
 ['#luU','#luP'].forEach(s=>{$(s).onkeydown=e=>{if(e.key=='Enter')doLogin()}});
 setTimeout(()=>{const e=$('#luU');if(e)e.focus()},0)}
async function doLogin(){
 const u=$('#luU').value.trim(),p=$('#luP').value;
 if(!u||!p)return msg('Escribe tu usuario y contraseña.');
 const email=toAuthEmail(u);
 justSignedIn=true;
 try{await signInWithEmailAndPassword(auth,email,p)}
 catch(e){
  justSignedIn=false;
  if(['auth/invalid-credential','auth/user-not-found','auth/wrong-password'].includes(e.code))msg('Usuario o contraseña incorrectos.');
  else showErr(e)
 }}
function logout(){signOut(auth)}
function changeMyPw(){
 openModal(`<h2 style="margin-top:0">Cambiar mi contraseña</h2><div class="g" style="grid-template-columns:1fr"><label>Contraseña actual<input id="cpOld" type="password"></label><label>Nueva contraseña<input id="cpNew" type="password"></label><label>Confirmar nueva contraseña<input id="cpNew2" type="password"></label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="doChangeMyPw()">Guardar</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#cpOld');if(e)e.focus()},0)}
async function doChangeMyPw(){
 const old=$('#cpOld').value,nw=$('#cpNew').value,nw2=$('#cpNew2').value;
 if(!old||!nw)return msg('Completa los dos campos.');
 if(nw.length<4)return msg('La nueva contraseña debe tener al menos 4 caracteres.');
 if(nw!=nw2)return msg('Las contraseñas no coinciden.');
 try{
  const cred=EmailAuthProvider.credential(auth.currentUser.email,old);
  await reauthenticateWithCredential(auth.currentUser,cred);
  await updatePassword(auth.currentUser,nw);
  closeModal();msg('Contraseña actualizada.')
 }catch(e){
  if(['auth/invalid-credential','auth/wrong-password'].includes(e.code))msg('La contraseña actual no es correcta.');
  else showErr(e)
 }}

function uView(){
 const rows=S.users.map(u=>`<tr><td><b>${esc(u.name)}</b>${session&&session.id==u.id?' <span class="m">(tú)</span>':''}</td><td>${esc(u.username)}</td><td>${u.role=='admin'?'Administrador':'Vendedor'}</td><td>${u.active===false?'Inactivo':'Activo'}</td><td class="r"><button class="l" onclick="editUser('${u.id}')">Editar</button> <button class="l" onclick="delUser('${u.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="5">Aún no hay usuarios.</td></tr>';
 return `<section><h2>Usuarios</h2><p class="m" style="margin-bottom:10px">Crea un perfil para cada vendedor. Los vendedores solo pueden ver inventario, entradas, salidas y deudores (sin modificarlos) y tienen acceso total a Ventas. Los administradores tienen acceso completo, incluyendo Nómina y Conteo físico. El nombre de usuario no se puede cambiar después de creado; si alguien olvida su contraseña, créale una cuenta nueva y desactiva la anterior.</p><div class="sc"><table><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th></th></tr>${rows}</table></div><div class="g" style="margin-top:12px"><label>Nombre<input id="unN" placeholder="Ej. María Pérez"></label><label>Usuario<input id="unU" autocomplete="off"></label><label>Contraseña<input id="unP" type="password" autocomplete="new-password"></label><label>Rol<select id="unR"><option value="vendedor">Vendedor</option><option value="admin">Administrador</option></select></label></div><button class="b" onclick="addUser()">Crear usuario</button></section>`}
async function addUser(){
 if(!isAdmin())return;
 const name=$('#unN').value.trim(),username=$('#unU').value.trim(),p=$('#unP').value,role=$('#unR').value;
 if(!name||!username)return msg('Escribe el nombre y el usuario.');
 if(!p||p.length<4)return msg('Escribe una contraseña de al menos 4 caracteres.');
 const email=toAuthEmail(username);
 if(email=='@eldiamante.local')return msg('Escribe un usuario válido (letras y números).');
 const secApp=initializeApp(firebaseConfig,'Secondary-'+Date.now());
 const secAuth=getAuth(secApp);
 try{
  const cred=await createUserWithEmailAndPassword(secAuth,email,p);
  const uid=cred.user.uid;
  try{await signOut(secAuth)}catch(e){}
  await setDoc(doc(db,'users',uid),{name,username,role,active:true});
  msg('Usuario creado.');render()
 }catch(e){
  if(e.code=='auth/email-already-in-use')msg('Ya existe un usuario con ese nombre de usuario.');
  else showErr(e)
 }finally{try{await deleteApp(secApp)}catch(e){}}}
function editUser(id){
 if(!isAdmin())return;
 const u=S.users.find(x=>x.id==id);if(!u)return;
 openModal(`<h2 style="margin-top:0">Editar usuario</h2><div class="g" style="grid-template-columns:1fr"><label>Nombre<input id="euN" value="${esc(u.name)}"></label><label>Usuario (no se puede cambiar)<input value="${esc(u.username)}" disabled></label><label>Rol<select id="euR"><option value="vendedor" ${u.role=='vendedor'?'selected':''}>Vendedor</option><option value="admin" ${u.role=='admin'?'selected':''}>Administrador</option></select></label><label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="euA" style="width:auto" ${u.active!==false?'checked':''}> Cuenta activa</label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="saveUser('${id}')">Guardar cambios</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#euN');if(e)e.focus()},0)}
async function saveUser(id){
 if(!isAdmin())return;
 const u=S.users.find(x=>x.id==id);if(!u)return;
 const name=$('#euN').value.trim(),role=$('#euR').value,active=$('#euA').checked;
 if(!name)return msg('Escribe el nombre.');
 const willStayAdmin=role=='admin'&&active,wasAdmin=u.role=='admin'&&u.active!==false;
 if(wasAdmin&&!willStayAdmin&&!S.users.some(x=>x.id!=id&&x.role=='admin'&&x.active!==false))return msg('Debe quedar al menos un administrador activo.');
 try{await updateDoc(doc(db,'users',id),{name,role,active});closeModal();msg('Usuario actualizado.');render()}
 catch(e){showErr(e)}}
function delUser(id){
 if(!isAdmin())return;
 const u=S.users.find(x=>x.id==id);if(!u)return;
 if(session&&session.id==id)return msg('No puedes eliminar tu propia cuenta mientras estás conectado con ella.');
 if(u.role=='admin'&&u.active!==false&&!S.users.some(x=>x.id!=id&&x.role=='admin'&&x.active!==false))return msg('Debe quedar al menos un administrador activo: no puedes eliminar el último.');
 ask(`¿Eliminar el acceso del usuario "${u.name}"? Ya no podrá entrar al sistema.`,async()=>{
  try{await deleteDoc(doc(db,'users',id));render()}catch(e){showErr(e)}})}

const stock=id=>S.mov.filter(m=>m.pid==id).reduce((a,m)=>a+m.u,0);
function fmt(p,u){let r=u,o=[];[...p.pres].sort((a,b)=>b.q-a.q).forEach(x=>{const n=Math.floor(r/x.q);if(n>0){o.push(n+' × '+esc(x.n));r-=n*x.q}});return o.join(' + ')||'0'}

let iq='';
function invRow(p){const u=stock(p.id),adm=isAdmin();
 const costCell=adm?`<input type="number" min="0" step="any" value="${rv(ucost(p.id))}" onchange="setCost('${p.id}',this.value)" aria-label="Costo unitario" style="width:110px">`:money(ucost(p.id));
 const priceCell=adm?`<input type="number" min="0" step="any" value="${rv(unitP(p))}" onchange="setUnitP('${p.id}',this.value)" aria-label="Precio de venta por unidad" style="width:110px">`:money(unitP(p));
 const presCell=p.pres.map((x,i)=>x.q>1?`${esc(x.n)} (${x.q} u): ${money(x.p)}`+(adm?` <button class="l" onclick="delPres('${p.id}',${i})">quitar</button>`:''):'').filter(Boolean).join('<br>')||'Solo unidad';

   const items=lines.map(l=>({name:l.name,pn:l.pn,q:l.q,sub:l.sub}));

  });

 const devengado=sal+ta+extras+oi,deducciones=ded+od;
 return{w,dias,sal,ta,extras,oi,od,devengado,hp,ded,deducciones,neto:devengado-deducciones}}

const DAY=86400000;
function debtCalc(d){const paid=d.payments.reduce((a,p)=>a+p.amount,0);return{paid,balance:d.amount-paid}}
function dueInfo(d){if(d.term==null)return null;const due=d.date+d.term*DAY;return{due,left:Math.ceil((due-Date.now())/DAY)}}
function sortDebts(arr){
 return[...arr].sort((a,b)=>{
  const pa=debtCalc(a).balance<=0.01,pb=debtCalc(b).balance<=0.01;if(pa!=pb)return pa?1:-1;
  const ia=dueInfo(a),ib=dueInfo(b);if(ia&&ib)return ia.left-ib.left;if(ia)return -1;if(ib)return 1;return a.date-b.date})}
function dAlerts(){return S.debts.filter(d=>{const c=debtCalc(d),inf=dueInfo(d);return c.balance>0.01&&inf&&inf.left<=3}).sort((a,b)=>dueInfo(a).left-dueInfo(b).left)}
function dRow(d){
 const adm=isAdmin(),c=debtCalc(d),pagado=c.balance<=0.01,inf=dueInfo(d);let vence;
 if(!inf)vence='<span class="m">Sin plazo</span>';
 else{const f=new Date(inf.due).toLocaleDateString('es');
  if(pagado)vence=`<span class="m">${f}</span>`;
  else if(inf.left<0)vence=`<b class="neg">Venció hace ${-inf.left} día(s)</b><div class="m">${f}</div>`;
  else if(inf.left==0)vence=`<b class="neg">Vence hoy</b><div class="m">${f}</div>`;
  else if(inf.left<=3)vence=`<b style="color:var(--ac)">Vence en ${inf.left} día(s)</b><div class="m">${f}</div>`;
  else vence=`En ${inf.left} días<div class="m">${f}</div>`}
 const abonoCell=pagado?'<span class="pos">Pagado</span>':(adm?`<input type="number" min="0" max="${c.balance}" step="any" id="ab${d.id}" placeholder="Abono" style="width:90px;display:inline-block"> <button class="l" onclick="addAbono('${d.id}')">Registrar</button>`:'<span class="m">—</span>');
 return `<tr><td><b>${esc(d.name)}</b>${d.note?`<div class="m">${esc(d.note)}</div>`:''}</td><td class="m">${new Date(d.date).toLocaleDateString('es')}</td><td>${vence}</td><td class="r">${money(d.amount)}</td><td class="r">${money(c.paid)}</td><td class="r ${pagado?'pos':'neg'}"><b>${money(c.balance)}</b></td><td class="r">${abonoCell}</td>${adm?`<td class="r"><button class="l" onclick="delDebt('${d.id}')">Eliminar</button></td>`:''}</tr>`}

 return `<section><h2>Deudas y deudores</h2>${alertHtml}<div class="kp"><div><span class="m">Total por cobrar</span><b class="pos">${money(totR)}</b></div><div><span class="m">Total por pagar</span><b class="neg">${money(totP)}</b></div><div><span class="m">Balance neto</span><b class="${totR-totP<0?'neg':'pos'}">${money(totR-totP)}</b></div></div></section>

async function addDebt(type){
 if(!isAdmin())return;
 const nm=type=='r'?'rn':'dn',am=type=='r'?'ra':'da',dt=type=='r'?'rd':'dd',tm=type=='r'?'rt':'pt',mo=type=='r'?'rm':'dm';
 const name=$('#'+nm).value.trim(),amount=+$('#'+am).value,date=$('#'+dt).value,term=$('#'+tm).value,note=$('#'+mo).value.trim();
 if(!name)return msg('Escribe el nombre.');
 if(!(amount>0))return msg('Escribe un monto mayor a cero.');
 if(!date)return msg('Escribe la fecha.');
 try{
  await addDoc(collection(db,'debts'),{type,name,amount,date:new Date(date+'T12:00:00').getTime(),term:term!==''?Math.max(0,Math.floor(+term)):null,note,payments:[]});
  msg(type=='r'?'Deudor agregado.':'Deuda agregada.');render()
 }catch(e){showErr(e)}}
async function addAbono(id){
 if(!isAdmin())return;
 const d=S.debts.find(x=>x.id==id),v=$('#ab'+id)?$('#ab'+id).value:'';
 if(!d||v==='')return msg('Escribe el monto del abono.');
 const amt=+v,c=debtCalc(d);
 if(!(amt>0))return msg('Escribe un monto mayor a cero.');
 if(amt>c.balance+0.01)return msg('El abono no puede ser mayor al saldo pendiente ('+money(c.balance)+').');
 try{
  const dRef=doc(db,'debts',id);
  await runTransaction(db,async tx=>{
   const snap=await tx.get(dRef);if(!snap.exists())throw new Error('No encuentro esa deuda.');
   const payments=snap.data().payments||[];payments.push({t:Date.now(),amount:amt});
   tx.update(dRef,{payments})});
  await addDoc(collection(db,'cash'),{t:Date.now(),k:d.type=='r'?'in':'out',c:d.type=='r'?'Cobro de deuda':'Pago de deuda',a:amt,debtId:id});
  msg('Abono registrado.');render()
 }catch(e){showErr(e)}}
function delDebt(id){
 if(!isAdmin())return;
 const d=S.debts.find(x=>x.id==id);if(!d)return;
 ask(`¿Eliminar a "${d.name}" de ${d.type=='r'?'deudores':'deudas'}? También se eliminarán sus abonos registrados en Flujo de dinero.`,async()=>{
  try{
   const cashDocs=S.cash.filter(c=>c.debtId==id);
   for(const c of cashDocs){await deleteDoc(doc(db,'cash',c.id))}
   await deleteDoc(doc(db,'debts',id));render()
  }catch(e){showErr(e)}})}

function backup(){
 if(!isAdmin())return;
 const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='copia-distribuidora-'+ld(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('Copia guardada en tu carpeta de descargas.')}
function restore(file){
 if(!isAdmin())return;
 if(!file)return;const r=new FileReader();
 r.onload=()=>{
  let d;
  try{d=JSON.parse(r.result);if(!d.products||!d.mov)throw 0}
  catch(e){msg('El archivo no es una copia válida.');return}
  ask('Esto importará los datos de la copia DENTRO de la base de datos en la nube, sumándose a los datos actuales (no los reemplaza). Las cuentas de usuario de la copia no se importan: solo el inventario, movimientos, ventas, nómina y deudas. ¿Continuar?',async()=>{
   try{
    msg('Importando datos… esto puede tardar un momento, no cierres esta ventana.');
    const idMap={};
    for(const p of d.products||[]){const ref=await addDoc(collection(db,'products'),{name:p.name,pres:p.pres,...(p.cost!=null?{cost:p.cost}:{})});idMap[p.id]=ref.id}
    for(const m of d.mov||[]){await addDoc(collection(db,'movements'),{t:m.t,pid:idMap[m.pid]!==undefined?idMap[m.pid]:m.pid,nm:m.nm||null,type:m.type,pn:m.pn,pq:m.pq,u:m.u,tot:m.tot??null,cost:m.cost??null,f:m.f??null})}
    for(const c of d.cash||[]){await addDoc(collection(db,'cash'),{t:c.t,k:c.k,c:c.c,a:c.a})}
    for(const c of d.counts||[]){await addDoc(collection(db,'counts'),{t:c.t,pid:idMap[c.pid]!==undefined?idMap[c.pid]:c.pid,s:c.s,c:c.c,d:c.d})}
    for(const f of d.inv||[]){await addDoc(collection(db,'invoices'),{n:f.n,t:f.t,cl:f.cl,vendor:f.vendor||null,items:f.items,total:f.total,pay:f.pay})}
    for(const w of d.workers||[]){await addDoc(collection(db,'workers'),{name:w.name,salary:w.salary,transport:w.transport,hp:w.hp})}
    for(const p of d.payroll||[]){await addDoc(collection(db,'payroll'),{t:p.t,workerId:p.workerId,workerName:p.workerName,period:p.period||'',dias:p.dias,sal:p.sal,ta:p.ta,extras:p.extras,oi:p.oi,devengado:p.devengado,ded:p.ded,od:p.od,deducciones:p.deducciones,neto:p.neto})}
    for(const deb of d.debts||[]){await addDoc(collection(db,'debts'),{type:deb.type,name:deb.name,amount:deb.amount,date:deb.date,term:deb.term,note:deb.note||'',payments:deb.payments||[]})}
    if(d.cfg&&d.cfg.transportAux)await setDoc(doc(db,'config','main'),{transportAux:d.cfg.transportAux},{merge:true});
    msg('Copia importada correctamente.')
   }catch(e){showErr(e)}})};
 r.readAsText(file)}

function findP(n){n=n.trim().toLowerCase();return S.products.find(p=>p.name.toLowerCase()==n)}
function ucost(id){const p=S.products.find(x=>x.id==id);if(p&&p.cost!=null)return p.cost;let c=0,u=0;S.mov.forEach(m=>{if(m.pid==id&&m.type=='Compra'&&m.cost!=null&&m.u>0){c+=m.cost;u+=m.u}});return u?c/u:null}
function entradaHist(){
 const rows=[...S.mov].filter(m=>m.type=='Compra').reverse().map(m=>{const p=S.products.find(x=>x.id==m.pid);return `<tr><td>${new Date(m.t).toLocaleString('es',{dateStyle:'short',timeStyle:'short'})}</td><td>${esc(p?p.name:(m.nm||'(eliminado)'))}</td><td class="r">${m.pq} u</td><td class="r">${m.cost!=null?money(m.cost):'—'}</td></tr>`}).join('')||'<tr><td colspan="4">Aún no hay entradas registradas.</td></tr>';
 return `<section><h2>Historial de entradas</h2><div class="sc"><table><tr><th>Fecha</th><th>Producto</th><th class="r">Unidades</th><th class="r">Costo total</th></tr>${rows}</table></div></section>`}
function eView(){
 if(!isAdmin())return entradaHist();
 return `<section><h2>Registrar entrada</h2><p class="m" style="margin-bottom:10px">Registra la compra en unidades. Si el producto ya existe se suma a su stock; si no, se crea como nuevo. Las presentaciones y los precios de venta los defines al vender.</p><div class="g"><label>Producto<input id="ep" list="el" autocomplete="off" placeholder="Escribe el nombre"><datalist id="el">${S.products.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></label><label>Cantidad (unidades)<input id="eq" type="number" min="1" value="1"></label><label>Costo unitario<input id="ec" type="number" min="0"></label><label>Costo total<input id="et" readonly placeholder="Unidades × costo unitario"></label></div><p id="info"></p><button class="b" id="go">Registrar entrada</button></section>
 ${entradaHist()}`}
function wireE(){
 if(!isAdmin()||!$('#go'))return;
 const upd=()=>{const name=$('#ep').value.trim(),p=findP(name),q=Math.floor(+$('#eq').value)||0,c=$('#ec').value;
  let t=!name?'Escribe el nombre. Si el producto ya existe, se suma al stock; si no, se crea como nuevo.':p?`Se sumará a «${p.name}»: stock ${stock(p.id)} → ${stock(p.id)+q} u`:'Producto nuevo: se creará en el inventario.';
  $('#et').value=q>0&&c!==''?money(q*c):'';$('#info').textContent=t};
 ['#ep','#eq','#ec'].forEach(k=>{$(k).oninput=upd});upd();
 $('#go').onclick=async()=>{
  if(!isAdmin())return;
  const name=$('#ep').value.trim(),q=Math.floor(+$('#eq').value);
  if(!name)return msg('Escribe el nombre del producto.');
  if(!(q>0))return msg('Escribe una cantidad mayor a cero.');
  try{
   let p=findP(name);const nuevo=!p;let pid;
   if(nuevo){const ref=await addDoc(collection(db,'products'),{name,pres:[{n:'Unidad',q:1,p:null}]});pid=ref.id}
   else{pid=p.id}
   const cost=$('#ec').value!==''?q*+$('#ec').value:null;
   if(cost!==null){
    const cu=cost/q,s0=nuevo?0:Math.max(0,stock(pid)),c0=nuevo?null:ucost(pid);
    const newCost=(!s0||c0==null)?cu:(s0*c0+q*cu)/(s0+q);
    await updateDoc(doc(db,'products',pid),{cost:newCost})}
   await addDoc(collection(db,'movements'),{t:Date.now(),pid,nm:name,type:'Compra',pn:'Unidad',pq:q,u:q,tot:null,cost});
   msg(nuevo?'Producto nuevo creado y entrada registrada.':'Entrada registrada: el stock se actualizó.');render()
  }catch(e){showErr(e)}}}

function openModal(html){$('#mdBox').innerHTML=html;$('#mdBg').hidden=false}
function closeModal(){$('#mdBg').hidden=true;$('#mdBox').innerHTML=''}
function pickP(id){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id);if(!p)return;
 openModal(`<h2 style="margin-top:0">Embalar: ${esc(p.name)}</h2><p class="m" style="margin-bottom:10px">Define cómo vendes este producto: por paca, caja u otra presentación, con su precio. El precio de la unidad se cambia en la tabla de Productos y stock. Si ya existe una presentación con las mismas unidades, se actualiza.</p><div class="g"><label>Presentación<input id="bn" placeholder="Ej. Paca"></label><label>Unidades que trae<input id="bq" type="number" min="1"></label><label>Precio de venta<input id="bpr" type="number" min="0"></label></div><div style="display:flex;gap:10px;margin-top:12px"><button class="b" onclick="embalar('${id}')">Guardar presentación</button><button class="l" onclick="closeModal()">Cancelar</button></div>`);
 setTimeout(()=>{const e=$('#bn');if(e)e.focus()},0)}
async function embalar(id){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id),n=$('#bn').value.trim(),q=Math.floor(+$('#bq').value),pr=$('#bpr').value;
 if(!p)return msg('No encuentro ese producto.');
 if(!n||!(q>0)||pr==='')return msg('Escribe el nombre, las unidades que trae y el precio de venta.');
 const pres=p.pres.map(x=>({...x})),x=pres.find(z=>z.q==q);
 if(x){x.n=n;x.p=+pr}else pres.push({n,q,p:+pr});
 pres.sort((a,b)=>a.q-b.q);
 try{await updateDoc(doc(db,'products',id),{pres});closeModal();msg(`Presentación "${n}" (${q} u) guardada en ${p.name}.`);render()}
 catch(e){showErr(e)}}
function delPres(id,i){
 if(!isAdmin())return;
 const p=S.products.find(x=>x.id==id),x=p.pres[i];if(!p||!x)return;
 ask(`¿Quitar la presentación "${x.n}" de ${p.name}?`,async()=>{
  try{const pres=p.pres.filter((_,idx)=>idx!=i);await updateDoc(doc(db,'products',id),{pres});render()}
  catch(e){showErr(e)}})}

const rv=n=>n==null?'':Math.round(n*100)/100;
function unitP(p){const u=p.pres.find(x=>x.q==1);return u?u.p:null}
async function setCost(id,v){
 if(!isAdmin())return;if(v==='')return render();
 try{await updateDoc(doc(db,'products',id),{cost:Math.max(0,+v)});msg('Costo unitario actualizado.');render()}
 catch(e){showErr(e)}}
async function setUnitP(id,v){
 if(!isAdmin())return;if(v==='')return render();
 const p=S.products.find(x=>x.id==id);if(!p)return;
 const pres=p.pres.map(x=>({...x})),u=pres.find(x=>x.q==1);
 if(u)u.p=Math.max(0,+v);else pres.unshift({n:'Unidad',q:1,p:Math.max(0,+v)});
 try{await updateDoc(doc(db,'products',id),{pres});msg('Precio de venta actualizado.');render()}
 catch(e){showErr(e)}}
async function setPresPrice(id,i,v){
 if(!isAdmin())return;if(v==='')return render();
 const p=S.products.find(x=>x.id==id);if(!p)return;
 const pres=p.pres.map(x=>({...x}));pres[i].p=Math.max(0,+v);
 try{await updateDoc(doc(db,'products',id),{pres});msg('Precio de '+pres[i].n+' actualizado en '+p.name+'.');render()}
 catch(e){showErr(e)}}
let pzSel='';
function updPriceProduct(){
 pzSel=$('#pzn').value;const p=findP(pzSel),e=$('#pzBody');if(!e)return;
 if(!p){e.innerHTML=pzSel.trim()?'<p class="m">No encuentro ese producto.</p>':'';return}
 const idx=[];p.pres.forEach((x,i)=>{if(x.q>1)idx.push(i)});
 if(!idx.length){e.innerHTML=`<p class="m">"${esc(p.name)}" todavía no tiene pacas, cajas u otras presentaciones. Agrégalas en "Embalar un producto" más abajo.</p>`;return}
 e.innerHTML=`<div class="sc"><table><tr><th>Presentación</th><th class="r">Precio de venta</th></tr>${idx.map(i=>{const x=p.pres[i];return `<tr><td>${esc(x.n)} (${x.q} u)</td><td class="r"><input type="number" min="0" step="any" value="${rv(x.p)}" onchange="setPresPrice('${p.id}',${i},this.value)" aria-label="Precio de venta" style="width:120px"></td></tr>`}).join('')}</table></div>`}
function wirePrices(){if($('#pzn'))updPriceProduct()}
function pricesView(){
 if(!S.products.length)return '<section><h2>Actualizar precios</h2><p class="m">Primero agrega productos en Inventario.</p></section>';
 const names=[...S.products].sort((a,b)=>a.name.localeCompare(b.name,'es')).map(p=>`<option value="${esc(p.name)}">`).join('');
 return `<section><h2>Actualizar precios</h2><p class="m" style="margin-bottom:10px">Elige el producto al que le quieres actualizar el precio de sus pacas, cajas u otras presentaciones. El precio de la unidad se cambia arriba, en la tabla de Productos y stock.</p><div class="g"><label>Producto<input id="pzn" list="pzl" autocomplete="off" placeholder="Escribe el nombre" value="${esc(pzSel)}" oninput="updPriceProduct()"><datalist id="pzl">${names}</datalist></label></div><div id="pzBody"></div></section>`}

function reset(){
 if(!isAdmin())return;
 ask('¿Borrar TODOS los datos del negocio (productos, movimientos, ventas, nómina, deudas, etc.)? Esta acción no se puede deshacer. Las cuentas de usuario NO se borran.',async()=>{
  try{
   msg('Borrando datos… esto puede tardar un momento.');
   const cols=['products','movements','cash','counts','invoices','workers','payroll','debts'];
   for(const colName of cols){
    const snap=await getDocs(collection(db,colName));
    for(const dc of snap.docs){await deleteDoc(dc.ref)}}
   await setDoc(doc(db,'config','main'),{transportAux:0,invoiceSeq:0},{merge:true});
   msg('Datos del negocio borrados.')
  }catch(e){showErr(e)}})}

function render(){
 if(!session){
  document.querySelector('nav').hidden=true;
  $('#sess').innerHTML='';$('#adminTools').hidden=true;
  if(!authReady){$('#v').innerHTML='<section><p class="m">Cargando…</p></section>';return}
  if(cfgHasAdmin===null){$('#v').innerHTML='<section><p class="m">Cargando…</p></section>';checkHasAdmin();return}
  $('#v').innerHTML=cfgHasAdmin?loginView():setupView();
  if(cfgHasAdmin)wireLogin();else wireSetup();
  return}
 document.querySelector('nav').hidden=false;
 const allowed=allowedTabs(session.role);
 if(!allowed.includes(tab))tab=allowed[0];
 document.querySelectorAll('nav button').forEach(b=>{b.hidden=!allowed.includes(b.dataset.t);b.classList.toggle('on',b.dataset.t==tab)});
 $('#sess').innerHTML=`Conectado como <b>${esc(session.name)}</b> (${session.role=='admin'?'Administrador':'Vendedor'}) · <button class="l" onclick="changeMyPw()">Cambiar contraseña</button> · <button class="l" onclick="logout()">Cerrar sesión</button>`;
 $('#adminTools').hidden=!isAdmin();
 const nb=document.querySelector('nav button[data-t="d"]'),na=(isAdmin()?dAlerts():dAlerts().filter(d=>d.type=='r')).length;
 if(nb)nb.innerHTML='Deudas'+(na?`<span class="bd">${na}</span>`:'');
 $('#v').innerHTML=tab=='inv'?invView():tab=='fc'?fcView():tab=='in'?eView():tab=='out'?sView():tab=='k'?kView():tab=='c'?cView():tab=='f'?fView():tab=='n'?nView():tab=='d'?dView():uView();
 if(tab=='in')wireE();if(tab=='c')wireCount();if(tab=='f')wireF();if(tab=='fc')wireFc();if(tab=='n')wireN();if(tab=='inv')wirePrices()}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
$('#mdBg').onclick=e=>{if(e.target.id=='mdBg')closeModal()};
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeModal()});
Object.assign(window,{backup,reset,restore,editWorker,delWorker,addWorker,saveWorker,closeModal,pickP,delP,delPres,setCost,setUnitP,setPresPrice,embalar,editUser,delUser,addUser,saveUser,filterInv,filterDebtsR,filterDebtsP,addDebt,addAbono,delDebt,delCash,addCash,delLine,addLine,issue,printInvoice,togglePay,updPriceProduct,delPayroll,logout,changeMyPw,doChangeMyPw});
render();
</script>
